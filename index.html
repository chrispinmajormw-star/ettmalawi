    function LoginPage({ onLogin, onPublicView, onRegister }) {
      const [mode, setMode] = useState("choice");

      // LOGIN
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");

      // REGISTER
      const [reg, setReg] = useState({
        name: "",
        district: "",
        designation: "",
        email: "",
        school: "",
        cluster: "",
        password: ""
      });

      const doLogin = async () => {
        if (!email || !pass) {
          setErr("Please enter email and password");
          return;
        }

        setLoading(true);

        await new Promise(r => setTimeout(r, 500));

        const allUsers = [
          ...USERS_INIT,
          ...(JSON.parse(localStorage.getItem("ett_users") || "[]"))
        ];

        const u = allUsers.find(
          x => x.email === email && x.password === pass
        );

        setLoading(false);

        if (!u) {
          setErr("Invalid email or password");
          return;
        }

        onLogin(u);
      };

      const createAccount = () => {
        if (
          !reg.name ||
          !reg.district ||
          !reg.designation ||
          !reg.email ||
          !reg.password
        ) {
          setErr("Please fill all mandatory fields");
          return;
        }

        const users = JSON.parse(localStorage.getItem("ett_users") || "[]");

        const exists = users.find(
          u => u.email === reg.email
        );

        if (exists) {
          setErr("Account already exists");
          return;
        }

        const newUser = {
          id: Date.now().toString(),
          name: reg.name,
          district: reg.district,
          designation: reg.designation,
          email: reg.email,
          school: reg.school,
          cluster: reg.cluster,
          password: reg.password,
          role: "viewer",
          avatar: reg.name
            .split(" ")
            .map(x => x[0])
            .join("")
            .toUpperCase()
        };

        users.push(newUser);

        localStorage.setItem(
          "ett_users",
          JSON.stringify(users)
        );

        onRegister(newUser);
      };

      return (
        <div style={{
          minHeight: "100vh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: "linear-gradient(180deg,#fff 0%,#fff7ef 100%)",
          padding: 16
        }}>
          <div style={{
            width: "100%",
            maxWidth: 450,
            background: "#fff",
            borderRadius: 16,
            padding: 28,
            boxShadow: "0 18px 48px rgba(234,108,10,.16)"
          }}>

              <AfricaLogo size={60} variant="black" />
              <h1 style={{ margin: "12px 0 5px" }}>
                ETT Malawi
              </h1>
              <p style={{ color: "#6b7280" }}>
                Ujamaa Pamodzi Africa
              </p>
            </div>

            {/* CHOICE SCREEN */}
            {mode === "choice" && (
              <>
                <Btn
                  full
                  onClick={() => setMode("login")}
                  style={{ marginBottom: 12 }}
                >
                  Login
                </Btn>

                <Btn
                  full
                  variant="secondary"
                  onClick={() => setMode("register")}
                  style={{ marginBottom: 12 }}
                >
                  Create Account
                </Btn>

                <Btn
                  full
                  variant="ghost"
                  onClick={onPublicView}
                >
                  View Public Dashboard
                </Btn>
              </>
            )}

            {/* LOGIN */}
            {mode === "login" && (
              <>
                <h2 style={{ marginBottom: 18 }}>
                  Sign In
                </h2>

                <FInput
                  label="Email"
                  type="email"
                  value={email}
                  onChange={e => setEmail(e.target.value)}
                />

                <FInput
                  label="Password"
                  type="password"
                  value={pass}
                  onChange={e => setPass(e.target.value)}
                />

                {err && (
                  <div style={{
                    background: "#fee2e2",
                    color: "#991b1b",
                    padding: 10,
                    borderRadius: 8,
                    marginBottom: 12,
                    fontSize: 12
                  }}>
                    {err}
                  </div>
                )}

                <Btn
                  full
                  onClick={doLogin}
                  disabled={loading}
                >
                  {loading ? "Signing In..." : "Sign In"}
                </Btn>

                <div style={{ marginTop: 12 }}>
                  <Btn
                    variant="ghost"
                    onClick={() => setMode("choice")}
                  >
                    ← Back
                  </Btn>
                </div>
              </>
            )}

            {/* REGISTER */}
            {mode === "register" && (
              <>
                <h2 style={{ marginBottom: 18 }}>
                  Create Account
                </h2>

                <FInput
                  label="Full Name *"
                  value={reg.name}
                  onChange={e => setReg({ ...reg, name: e.target.value })}
                />

                <FSelect
                  label="District *"
                  value={reg.district}
                  onChange={e => setReg({ ...reg, district: e.target.value })}
                >
                  <option value="">Select district</option>

                  {DISTRICT_LIST.map(d => (
                    <option key={d}>{d}</option>

                </FSelect>

                <FInput
                  label="Designation *"
                  value={reg.designation}

                />

                <FInput
                  label="Email *"

                />

                <FInput
                  label="School Name"
                  value={reg.school}
                  onChange={e => setReg({ ...reg, school: e.target.value })}
                />

                <FInput

                />

                <FInput

                {err && (

                    padding: 10,
                    borderRadius: 8,
                    marginBottom: 12,
                    fontSize: 12

                )}

                <Btn

                <div style={{ marginTop: 12 }}>

                </div>

            )}

      );

 // ─────────────────────────────────────────────
// DASHBOARD  (role-aware)
// ─────────────────────────────────────────────
function Dashboard({ user, reports, setPage }) {
  const currentUser = user || { role: "viewer", name: "Public Viewer", district: null };
  const isPublic = !user;
  const my = (currentUser.role === "data_entry" || currentUser.role === "tot")
    ? reports.filter(r => r.submitted_by === currentUser.name)
    : currentUser.role === "district_coordinator"
    ? reports.filter(r => r.district === currentUser.district)
    : reports;
  const pending  = my.filter(r => r.status === "pending").length;
  const approved = my.filter(r => r.status === "approved").length;
  const students = my.reduce((a, r) => a + r.boys + r.girls, 0);
  const rc = ROLE_CFG[currentUser.role];

  // ── Tracking data ──────────────────────────────────────────────────
  const YEARLY_DATA = [
    { year: "2023", schools: 116,  teachers: 228,  learners: 45600,  targetSchools: 225,   targetLearners: 45000 },
    { year: "2024", schools: 357,  teachers: 727,  learners: 145400, targetSchools: 950,   targetLearners: 190000 },
    { year: "2025", schools: 975,  teachers: 1973, learners: 395000, targetSchools: 3000,  targetLearners: 600000, current: true },
    { year: "2026", schools: 18,   teachers: 36,   learners: 7200,   targetSchools: 6000,  targetLearners: 1200000 },
    { year: "2027", schools: 0,    teachers: 0,    learners: 0,      targetSchools: 10000, targetLearners: 2000000, planned: true },
  ];

  const PROJECTS = [
    {
      tag: "JPGE", label: "JPGE Project", period: "2015–2022",
      total: 63128, color: "#1a5fa8", pale: "#e6f1fb",
      districts: ["Kasungu", "Dedza", "Salima", "Mangochi"],
      boys:  [8406, 9732, 10829, 15155],
      girls: [841,  1094,  9966, 14000],
    },
    {
      tag: "CWA", label: "CWA Project", period: "2022–2023",
      total: 1738, color: "#0f6e56", pale: "#e1f5ee",
      districts: ["Mzimba", "Mchinji", "Lilongwe"],
      boys:  [175, 152, 167],
      girls: [181, 186, 187],
    },
    {
      tag: "LSN", label: "LSN Project", period: "Special Needs 2024–2025",
      total: 4974, color: "#854f0b", pale: "#faeeda",
      districts: ["Mzimba","Blantyre","Lilongwe","Dowa","Kasungu","Machinga","Zomba","Ntcheu"],
      boys:  [260, 313, 200, 239, 340, 450, 215, 521],
      girls: [313, 260, 205, 239, 349, 357, 227, 2471],
    },
    {
      tag: "STEVENS", label: "Stevens", period: "2020",
      total: 8937, color: "#993c1d", pale: "#faece7",
      districts: ["Salima","Dedza","Mangochi","Nsanje","Nkhata Bay","Mzimba","Dowa","Ntchisi"],
      boys:  [801, 850, 374, 360, 360, 360, 260, 260],
      girls: [925, 511, 374, 360, 360, 361, 458, 260],
    },
  ];

  const SUMMARY_BADGES = [
    { label: "Total Clusters", value: "393", color: "#854f0b", pale: "#faeeda" },
    { label: "ToTs",           value: "722", color: "#185fa5", pale: "#e6f1fb" },
    { label: "Total Meetings", value: "371", color: "#0f6e56", pale: "#e1f5ee" },
    { label: "Senior ToTs",    value: "9",   color: "#534ab7", pale: "#eeedfe" },
  ];

  // Overall gender totals across all projects (for donut)
  const totalBoys  = PROJECTS.reduce((s, p) => s + p.boys.reduce((a, b) => a + b, 0), 0);
  const totalGirls = PROJECTS.reduce((s, p) => s + p.girls.reduce((a, b) => a + b, 0), 0);

  // ── Chart.js colours ──────────────────────────────────────────────
  const C_BLUE  = "#378ADD";
  const C_RED   = "#D85A30";
  const C_GREEN = "#1D9E75";
  const C_AMBER = "#BA7517";
  const C_GRID  = "rgba(0,0,0,0.05)";
  const C_TICK  = "#9ca3af";

  // ── Chart refs ────────────────────────────────────────────────────
  const chartRefs = React.useRef({});

  const mkBar = (ctx, labels, datasets, opts = {}) => new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: datasets.map(d => ({ borderRadius: 3, ...d })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { mode: "index", intersect: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: C_TICK, font: { size: opts.xSize || 10 }, maxRotation: opts.rotate || 0 } },
        y: { grid: { color: C_GRID },  ticks: { color: C_TICK, font: { size: 10 } } },
      },
    },
  });

  const mkLine = (ctx, labels, datasets) => new Chart(ctx, {
    type: "line",
    data: { labels, datasets: datasets.map(d => ({ fill: true, tension: 0.35, pointRadius: 5, pointHoverRadius: 7, ...d })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { mode: "index", intersect: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: C_TICK, font: { size: 11 } } },
        y: { grid: { color: C_GRID },  ticks: { color: C_TICK, font: { size: 11 } } },
      },
    },
  });

  const mkDonut = (ctx, labels, data, colors, total) => new Chart(ctx, {
    type: "doughnut",
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: "68%",
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: (item) => ` ${item.label}: ${item.parsed.toLocaleString()} (${Math.round(item.parsed / total * 100)}%)`,
        }},
      },
    },
  });

  React.useEffect(() => {
    if (typeof Chart === "undefined") return;
    const kill = (id) => { if (chartRefs.current[id]) { chartRefs.current[id].destroy(); delete chartRefs.current[id]; } };

    // 1. LINE — learners vs target
    const lineCtx = document.getElementById("up-line-learners");
    if (lineCtx) {
      kill("line-learners");
      chartRefs.current["line-learners"] = mkLine(
        lineCtx,
        YEARLY_DATA.map(d => d.year),
        [
          { label: "Actual learners", data: YEARLY_DATA.map(d => d.learners), borderColor: C_BLUE, backgroundColor: "rgba(55,138,221,0.08)", pointBackgroundColor: C_BLUE },
          { label: "Target learners", data: YEARLY_DATA.map(d => d.targetLearners), borderColor: C_AMBER, backgroundColor: "rgba(186,117,23,0.06)", borderDash: [5,4], pointBackgroundColor: C_AMBER },
        ]
      );
    }

    // 2. BAR — schools & teachers per year
    const barYearCtx = document.getElementById("up-bar-year");
    if (barYearCtx) {
      kill("bar-year");
      chartRefs.current["bar-year"] = mkBar(
        barYearCtx,
        YEARLY_DATA.map(d => d.year),
        [
          { label: "Schools reached",  data: YEARLY_DATA.map(d => d.schools),  backgroundColor: C_BLUE },
          { label: "Teachers trained", data: YEARLY_DATA.map(d => d.teachers), backgroundColor: C_GREEN },
        ]
      );
    }

    // 3. DONUT — overall gender split
    const donutCtx = document.getElementById("up-donut-gender");
    if (donutCtx) {
      kill("donut-gender");
      chartRefs.current["donut-gender"] = mkDonut(donutCtx, ["Boys","Girls"], [totalBoys, totalGirls], [C_BLUE, C_RED], totalBoys + totalGirls);
    }

    // 4. BAR + DONUT — per project
    PROJECTS.forEach((p, i) => {
      const barCtx = document.getElementById(`up-proj-bar-${i}`);
      if (barCtx) {
        kill(`proj-bar-${i}`);
        chartRefs.current[`proj-bar-${i}`] = mkBar(
          barCtx, p.districts,
          [
            { label: "Boys",  data: p.boys,  backgroundColor: C_BLUE },
            { label: "Girls", data: p.girls, backgroundColor: C_RED },
          ],
          { xSize: 9, rotate: 35 }
        );
      }

      const donutPCtx = document.getElementById(`up-proj-donut-${i}`);
      if (donutPCtx) {
        kill(`proj-donut-${i}`);
        const pb = p.boys.reduce((a,b) => a+b, 0);
        const pg = p.girls.reduce((a,b) => a+b, 0);
        chartRefs.current[`proj-donut-${i}`] = new Chart(donutPCtx, {
          type: "doughnut",
          data: { labels: ["Boys","Girls"], datasets: [{ data: [pb, pg], backgroundColor: [C_BLUE, C_RED], borderWidth: 0, hoverOffset: 4 }] },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: "62%",
            plugins: { legend: { display: false }, tooltip: { callbacks: {
              label: (item) => ` ${item.label}: ${item.parsed.toLocaleString()} (${Math.round(item.parsed/(pb+pg)*100)}%)`,
            }}},
          },
        });
      }
    });

    return () => Object.keys(chartRefs.current).forEach(kill);
  }, []);

  // ── Shared styles ──────────────────────────────────────────────────
  const S = {
    card:      { background: "#fff", border: "1px solid #f0f0f0", borderRadius: 16, padding: "18px 20px", boxSizing: "border-box" },
    label:     { fontSize: 11, color: "#9ca3af", marginBottom: 3 },
    value:     { fontSize: 22, fontWeight: 700, color: "#111827" },
    sub:       { fontSize: 10, color: "#c4c4c4", marginTop: 2 },
    hr:        { border: "none", borderTop: "1px solid #f3f4f6", margin: "10px 0" },
    dot:       (c) => ({ width: 9, height: 9, borderRadius: 2, background: c, display: "inline-block", marginRight: 4 }),
    box:       (h) => ({ position: "relative", width: "100%", height: h }),
    legendRow: { display: "flex", gap: 14, fontSize: 11, color: "#6b7280", flexWrap: "wrap", marginBottom: 10 },
    eyebrow:   { fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.4, color: "#9ca3af", marginBottom: 4 },
  };

  const Legend = ({ items }) => (
    <div style={S.legendRow}>
      {items.map(([label, color]) => (
        <span key={label}><span style={S.dot(color)} />{label}</span>
      ))}
    </div>
  );

  return (
    <div>

      {/* ══ Original: Hero banner ══════════════════════════════════════ */}
      <div style={{
        background: "linear-gradient(135deg,#fff 0%,#fff8f1 70%,#fff1e5 100%)",
        border: `1px solid ${OR_PALE}`, borderRadius: 24, padding: "42px 28px",
        color: "#111827", margin: "0 auto 24px auto", position: "relative",
        overflow: "hidden", boxShadow: "0 18px 44px rgba(59,38,33,.10)",
        textAlign: "center", maxWidth: 1300,
      }}>
        <div style={{ position:"absolute", top:-60, right:-60, width:220, height:220, borderRadius:"50%", background:"rgba(234,108,10,.08)" }} />
        <div style={{ position:"relative", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
          <div style={{ fontSize:11, color:OR, textTransform:"uppercase", letterSpacing:1.4, marginBottom:10, fontWeight:800 }}>
            {user ? "Welcome back" : "ETT Malawi National Program Dashboard"}
          </div>
          <h1 style={{ margin: "0 0 12px", fontSize: "clamp(2rem,5vw,3.5rem)", lineHeight: 1.05, fontWeight: 800, letterSpacing: "-1px", maxWidth: 900 }}>
            {user ? currentUser.name : "Empowering Safer Schools Across Malawi"}
          </h1>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8, flexWrap:"wrap", marginBottom:24 }}>
            <span style={{ background:OR_PALE, color:OR_D, padding:"6px 14px", borderRadius:999, fontSize:12, fontWeight:700, display:"flex", alignItems:"center", gap:6 }}>
              🌍 {user ? rc.label : "Public access"}
            </span>
            {currentUser.district && <span style={{ fontSize:12, color:"#6b7280" }}>📍 {currentUser.district}</span>}
          </div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"center" }}>
            {isPublic ? (
              <>
                <Btn onClick={() => setPage("maps")}>View Coverage Map</Btn>
                <Btn onClick={() => setPage("impact")} variant="secondary">Impact Stories</Btn>
                <Btn onClick={() => setPage("submit")} variant="ghost">Report a Concern</Btn>
                <Btn onClick={() => setPage("login")} style={{ background:OR, color:"#fff" }}>Staff Login</Btn>
              </>
            ) : (
              <>
                <Btn onClick={() => setPage("submit")}>Submit Report</Btn>
                {can(user.role,"approveReport") && pending > 0 && (
                  <Btn onClick={() => setPage("reports")} style={{ background:OR, color:"#fff" }}>Review ({pending})</Btn>
                )}
                {can(user.role,"manageUsers") && (
                  <Btn onClick={() => setPage("users")} style={{ background:OR, color:"#fff" }}>Manage Users</Btn>
                )}
              </>
            )}
          </div>
        </div>
      </div>

      {/* ══ Original: Stat strip ══════════════════════════════════════ */}
<div style={{
  display:"grid",
  gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",
  gap:14,
  marginBottom:24
}}>
  {isPublic ? (
    <>
      <StatCard icon="👨‍🎓" label="Learners Reached" value="107,080+" />
      <StatCard icon="🏫" label="Schools Covered" value="975" />
      <StatCard icon="📍" label="Districts Active" value="15" />
      <StatCard icon="🎓" label="TOTs Trained" value="722+" />
      <StatCard icon="📘" label="Sessions Conducted" value="1,240+" />
      <StatCard icon="🌍" label="Coverage Progress" value="69%" />
    </>
  ) : (
    <>
      <StatCard icon="📋" label="Reports" value={my.length} />
      <StatCard icon="⏳" label="Pending" value={pending} />
      <StatCard icon="✅" label="Approved" value={approved} />
      <StatCard icon="👨‍🎓" label="Students" value={students} />
    </>
  )}
</div>

{/* ══ Original: Program Impact ══════════════════════════════════ */}
{isPublic && (
  <Card style={{ marginBottom:24 }}>
    <SH title="Program Impact Across Malawi" />

    <div style={{
      display:"grid",
      gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",
      gap:18,
      alignItems:"stretch"
    }}>
      {[
        {
          icon:"👦",
          title:"Boys Empowerment",
          text:"Helping boys become respectful and responsible young men.",
          color:"#e8f4f8"
        },
        {
          icon:"👧",
          title:"Girls Empowerment",
          text:"Building confidence, safety awareness and leadership skills.",
          color:"#fdf2f8"
        },
        {
          icon:"🌍",
          title:"Community Protection",
          text:"Supporting safer schools and communities across Malawi.",
          color:"#f0f9f0"
        },
      ].map((item, i) => (
        <div
          key={i}
          style={{
            background:"#fff",
            border:"1px solid #e5e7eb",
            borderRadius:20,
            padding:"20px",
            display:"flex",
            alignItems:"flex-start",
            gap:16,
            boxSizing:"border-box",
            transition:"all .2s ease",
            cursor:"pointer",
            boxShadow:"0 2px 4px rgba(0,0,0,0.02)",
            width:"100%",
            minWidth:0
          }}
          onMouseEnter={e => {
            e.currentTarget.style.boxShadow="0 8px 20px rgba(0,0,0,0.08)";
            e.currentTarget.style.transform="translateY(-2px)";
          }}
          onMouseLeave={e => {
            e.currentTarget.style.boxShadow="0 2px 4px rgba(0,0,0,0.02)";
            e.currentTarget.style.transform="translateY(0)";
          }}
        >
          <div style={{
            width:52,
            minWidth:52,
            height:52,
            borderRadius:16,
            background:item.color,
            display:"flex",
            alignItems:"center",
            justifyContent:"center",
            fontSize:26
          }}>
            {item.icon}
          </div>

          <div style={{ flex:1, minWidth:0 }}>
            <div style={{
              fontWeight:700,
              fontSize:16,
              marginBottom:6,
              color:"#111827"
            }}>
              {item.title}
            </div>

            <div style={{
              fontSize:13.5,
              lineHeight:1.55,
              color:"#6b7280"
            }}>
              {item.text}
            </div>
          </div>
        </div>
      ))}
    </div>
  </Card>
)}

{/* ══ Original: Main grid ═══════════════════════════════════════ */}
<div style={{
  display:"grid",
  gridTemplateColumns:"repeat(auto-fit,minmax(340px,1fr))",
  gap:20,
  alignItems:"start",
  width:"100%"
}}>

  {!isPublic && (
    <Card
      style={{
        overflow:"hidden",
        width:"100%",
        minWidth:0,
        padding:"20px 0 0 0"
      }}
    >
      <div style={{ padding:"0 20px" }}>
        <SH
          title="Recent Reports"
          action={
            user
              ? (
                <Btn
                  size="sm"
                  variant="secondary"
                  onClick={() => setPage(user.role==="data_entry"?"my_reports":"reports")}
                >
                  View All →
                </Btn>
              )
              : (
                <Btn
                  size="sm"
                  variant="secondary"
                  onClick={() => setPage("login")}
                >
                  Sign In →
                </Btn>
              )
          }
        />
      </div>

      <div style={{
        overflowX:"auto",
        width:"100%",
        marginTop:8
      }}>
        <table style={{
          width:"100%",
          borderCollapse:"collapse",
          minWidth:700,
          fontSize:13
        }}>
          <TH cols={["School","District","Curriculum","Students","Status","Date"]} />

          <tbody>
            {my.slice(0,5).map(r => (
              <tr
                key={r.id}
                style={{ borderBottom:"1px solid #f3f4f6" }}
                onMouseEnter={e => {
                  e.currentTarget.style.background="#fafafa";
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.background="transparent";
                }}
              >
                <td style={{
                  padding:"14px 12px",
                  fontWeight:600,
                  whiteSpace:"nowrap"
                }}>
                  {r.school}
                </td>

                <td style={{
                  padding:"14px 12px",
                  color:"#6b7280"
                }}>
                  {r.district}
                </td>

                <td style={{ padding:"14px 12px" }}>
                  <Badge text={r.curriculum} />
                </td>

                <td style={{
                  padding:"14px 12px",
                  color:"#6b7280",
                  fontWeight:500
                }}>
                  {r.boys+r.girls}
                </td>

                <td style={{ padding:"14px 12px" }}>
                  <Pill s={r.status} />
                </td>

                <td style={{
                  padding:"14px 12px",
                  color:"#9ca3af",
                  fontSize:11,
                  whiteSpace:"nowrap"
                }}>
                  {r.submitted_at}
                </td>
              </tr>
            ))}

            {my.length===0 && (
              <tr>
                <td
                  colSpan={6}
                  style={{
                    padding:48,
                    textAlign:"center",
                    color:"#9ca3af",
                    fontSize:14
                  }}
                >
                  📭 No reports yet
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </Card>
  )}

  {/* ══════════════════════════════════════════════════════════════
      NEW ─ Ujamaa Pamodzi Numbers Tracking Tool
  ══════════════════════════════════════════════════════════════ */}

  <div style={{ marginTop:0, width:"100%" }}>

    {/* Section header */}
    <div style={{
      display:"flex",
      alignItems:"center",
      justifyContent:"space-between",
      flexWrap:"wrap",
      gap:10,
      marginBottom:16
    }}>
      <div>
        <div style={S.eyebrow}>
          Ujamaa Pamodzi · Numbers Tracking Tool
        </div>

        <div style={{
          fontSize:20,
          fontWeight:800,
          color:"#111827"
        }}>
          Transition to Scale-Up
        </div>
      </div>

      <div style={{
        display:"flex",
        gap:7,
        flexWrap:"wrap"
      }}>
        {SUMMARY_BADGES.map(b => (
          <span
            key={b.label}
            style={{
              background:b.pale,
              color:b.color,
              padding:"4px 12px",
              borderRadius:999,
              fontSize:11,
              fontWeight:700
            }}
          >
            {b.value} {b.label}
          </span>
        ))}
      </div>
    </div>

    {/* Yearly milestone cards */}
    <div style={{
      display:"grid",
      gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",
      gap:16,
      marginBottom:24,
      alignItems:"stretch"
    }}>
      {YEARLY_DATA.map(d => (
        <div
          key={d.year}
          style={{
            ...S.card,
            border:d.current
              ? "1.5px solid #378ADD"
              : "1px solid #f0f0f0",
            background:d.planned ? "#fafafa" : "#fff"
          }}
        >
          <div style={{
            display:"flex",
            justifyContent:"space-between",
            alignItems:"center",
            marginBottom:10
          }}>
            <span style={{
              fontSize:13,
              fontWeight:700,
              color:d.planned ? "#c4c4c4" : "#185fa5"
            }}>
              {d.year}
            </span>

            {d.current && (
              <span style={{
                fontSize:9,
                fontWeight:700,
                background:"#e6f1fb",
                color:"#185fa5",
                padding:"2px 7px",
                borderRadius:999
              }}>
                Current
              </span>
            )}

            {d.planned && (
              <span style={{
                fontSize:9,
                fontWeight:700,
                background:"#f3f4f6",
                color:"#9ca3af",
                padding:"2px 7px",
                borderRadius:999
              }}>
                Planned
              </span>
            )}
          </div>

          <div style={S.label}>Schools reached</div>
          <div style={{
            ...S.value,
            fontSize:18,

          }}>
            {d.schools.toLocaleString()}
          </div>

          <hr style={S.hr} />

          <div style={S.label}>Teachers trained</div>
          <div style={{
            ...S.value,
            fontSize:18
          }}>
            {d.teachers.toLocaleString()}
          </div>

          <hr style={S.hr} />

          <div style={S.label}>Learners trained</div>
          <div style={{
            ...S.value,
            fontSize:18
          }}>
            {d.learners.toLocaleString()}
          </div>

          <div style={S.sub}>
            target {d.targetSchools.toLocaleString()} schools ·{" "}
            {d.targetLearners.toLocaleString()} learners
          </div>
        </div>
      ))}
    </div>

    {/* CHART ROW */}
    <div style={{
      display:"grid",
      gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",
      gap:20,
      marginBottom:20
    }}>

      <div style={S.card}>
        <div style={{
          fontSize:13,
          fontWeight:700,
          color:"#111827",
          marginBottom:2
        }}>
          Learners Trained vs Target
        </div>

        <div style={{
          fontSize:11,
          color:"#9ca3af",
          marginBottom:10
        }}>
          Actual vs target across all years
        </div>

        <Legend items={[
          ["Actual learners", C_BLUE],
          ["Target", C_AMBER]
        ]} />

        <div style={S.box(200)}>
          <canvas id="up-line-learners" />
        </div>
      </div>

      <div style={S.card}>
        <div style={{
          fontSize:13,
          fontWeight:700,
          color:"#111827",
          marginBottom:2
        }}>
          Schools Reached & Teachers Trained
        </div>

        <div style={{
          fontSize:11,
          color:"#9ca3af",
          marginBottom:10
        }}>
          Annual totals across transition period
        </div>

        <Legend items={[
          ["Schools reached", C_BLUE],
          ["Teachers trained", C_GREEN]
        ]} />

        <div style={S.box(200)}>
          <canvas id="up-bar-year" />
        </div>
      </div>
    </div>

  </div>
</div>

{/* ══ Bottom Information Panels ═════════════════════════════ */}
<div style={{
  marginTop:32,
  display:"grid",
  gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",
  gap:20,
  alignItems:"stretch",
  width:"100%"
}}>

        {/* Quick Actions */}
        <Card style={{ padding:"20px" }}>
          <SH title="Quick Actions" />
          <div style={{ display:"grid", gap:12, marginTop:8 }}>
            <Btn onClick={() => setPage("submit")} full style={{ fontWeight:600, padding:"12px 16px" }}>
              📝 {user ? "Submit Report" : "Report Case"}
            </Btn>

            {user && (
              <Btn
                variant="secondary"
                onClick={() => setPage("curriculum")}
                full
                style={{ fontWeight:500, padding:"12px 16px" }}
              >
                📘 Curriculum
              </Btn>
            )}

            <Btn
              variant="ghost"
              onClick={() => setPage("maps")}
              full
              style={{ fontWeight:500, padding:"12px 16px" }}
            >
              🗺️ View Maps
            </Btn>

            {user && (
              <Btn
                variant="ghost"
                onClick={() => setPage("analytics")}
                full
                style={{ fontWeight:500, padding:"12px 16px" }}
              >
                📊 Analytics
              </Btn>
            )}
          </div>
        </Card>

        {/* Emergency Contacts */}
        <Card style={{
          background:"linear-gradient(135deg,#fff7ef 0%,#fffbf5 100%)",
          border:"1px solid #fde7cf",
          padding:"20px",
          position:"relative",
          overflow:"hidden"
        }}>
          <div style={{
            position:"absolute",
            top:-20,
            right:-20,
            fontSize:80,
            opacity:0.08,
            pointerEvents:"none"
          }}>
            🆘
          </div>

          <div style={{
            fontSize:12,
            fontWeight:800,
            textTransform:"uppercase",
            letterSpacing:1,
            color:"#92400e",
            marginBottom:14
          }}>
            ⚡ Emergency Contacts
          </div>

          <div style={{
            fontSize:14,
            lineHeight:2,
            color:"#374151",
            position:"relative",
            zIndex:1
          }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
              <span style={{ fontSize:18 }}>🆘</span>
              <span><b>Child Helpline:</b> 116</span>
            </div>

            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
              <span style={{ fontSize:18 }}>👮</span>
              <span><b>VSU Police:</b> 997</span>
            </div>

            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontSize:18 }}>📧</span>
              <span><b>Email:</b> info@ujamaa.mw</span>
            </div>
          </div>
        </Card>

        {/* Districts by Region */}
        <Card>
          <SH
            title="Districts by Region"
            action={
              <Btn
                size="sm"
                variant="secondary"
                onClick={() => setPage("districts")}
              >
                View All →
              </Btn>
            }
          />

          <div style={{
            display:"grid",
            gridTemplateColumns:"1fr",
            gap:14
          }}>
            {[
              {
                r:"Northern",
                active:"6/6",
                ds:["Chitipa","Karonga","Rumphi","Nkhata Bay","Mzimba","Likoma"]
              },
              {
                r:"Central",
                active:"6/9",
                ds:["Lilongwe","Dowa","Kasungu","Dedza","Ntcheu","Nkhotakota"]
              },
              {
                r:"Southern",
                active:"10/13",
                ds:["Blantyre","Zomba","Mangochi","Thyolo","Mulanje","Balaka"]
              },
            ].map(g => (
              <div key={g.r}>
                <div style={{
                  display:"flex",
                  justifyContent:"space-between",
                  fontSize:12,
                  fontWeight:700,
                  marginBottom:7
                }}>
                  <span>{g.r}</span>
                  <span style={{ color:OR }}>{g.active}</span>
                </div>

                <div style={{
                  display:"flex",
                  flexWrap:"wrap",
                  gap:6
                }}>
                  {g.ds.map(d => (
                    <span
                      key={d}
                      onClick={() => setPage("districts")}
                      style={{ padding:"4px 9px", borderRadius:7, fontSize:11, fontWeight:600, background:OR_PALE, color:OR_D, cursor:"pointer" }}
                    >
                      {d}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
      </div>
  );
}
    // ─────────────────────────────────────────────
    // SUBMIT REPORT
    // ─────────────────────────────────────────────
    
    function SubmitReport({ user, onSubmit, showToast }) {
      const isPublic = !user;
      const assignedCluster = user?.role === "tot" ? CLUSTERS.find(c => c.id === user.clusterId) : null;
      const E = isPublic
        ? { school: "", district: "", zone: "", boys: "", girls: "", curriculum: "Harassment or intimidation", session: "", challenges: "", success: "" }
        : { school: "", district: user?.district || "", zone: assignedCluster?.name || "", boys: "", girls: "", curriculum: "HIM", session: "", challenges: "", success: "" };
      const [f, setF] = useState(E);
      const [done, setDone] = useState(false);
      const s = k => e => setF(p => ({ ...p, [k]: e.target.value }));

      const submit = () => {
        if (isPublic) {
          if (!f.school || !f.district || !f.session) { showToast("Please fill in the required case details"); return; }
          onSubmit({ ...f, boys: parseInt(f.boys) || 0, girls: parseInt(f.girls) || 0, zone: f.zone || "Not specified", status: "pending", submitted_by: "Public case report", submitted_at: new Date().toISOString().split("T")[0] });
          setDone(true); showToast("Case report sent for safe review");
          return;
        }
        if (!f.school || !f.district || !f.zone || !f.session) { showToast("⚠️ Please fill in all required fields"); return; }
        onSubmit({ ...f, boys: parseInt(f.boys) || 0, girls: parseInt(f.girls) || 0, status: "pending", submitted_by: user.name, submitted_at: new Date().toISOString().split("T")[0] });
        setDone(true); showToast("✅ Report submitted — awaiting review");
      };

      if (done) return (
        // ✅ CENTER WRAPPER — already had margin:0 auto, keeping it
        <div style={{ maxWidth: 440, margin: "0 auto", textAlign: "center", padding: 36 }}>
          <div style={{ fontSize: 52, marginBottom: 10 }}>✅</div>
          <h2 style={{ margin: "0 0 8px", fontSize: 18, fontWeight: 700 }}>{isPublic ? "Case Report Sent" : "Report Submitted!"}</h2>
          <p style={{ color: "#6b7280", fontSize: 13, marginBottom: 18 }}>{isPublic ? "Thank you. A trained reviewer can use this information to guide support and referral. If someone is in immediate danger, call Child Helpline 116 or VSU Police 997 now." : "Pending review by your District Coordinator or National Admin."}</p>
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <Btn onClick={() => { setF(E); setDone(false); }}>{isPublic ? "Report Another Case" : "Submit Another"}</Btn>
            <Btn variant="secondary" onClick={() => setDone(false)}>Back</Btn>
          </div>
        </div>
      );

      if (isPublic) return (
        // ✅ CENTER WRAPPER ADDED HERE
        <div style={{ maxWidth: 760, margin: "0 auto" }}>
          <Kicker text="Safe Reporting" />
          <h1 style={{ margin: "0 0 4px", fontSize: 23, fontWeight: 800, color: BLACK }}>Report a Case</h1>
          <p style={{ margin: "0 0 14px", color: "#4b5563", fontSize: 13, lineHeight: 1.6 }}>Use this page to report suspected or confirmed SGBV concerns safely. Do not include graphic details. Share only what is needed to help the right people respond.</p>

          <Card style={{ background: BLACK, color: "#fff", border: "none", marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, lineHeight: 1.7 }}>
              <b>You can report:</b> sexual harassment, assault, defilement, exploitation, coercion, threats, bullying linked to gender, unsafe school routes, online abuse, forced relationships, child marriage concerns, or urgent protection and referral needs.
            </div>
            <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.68)", marginTop: 8 }}>Emergency contacts: Child Helpline 116 · VSU Police 997</div>
          </Card>

          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="Where did it happen? *" placeholder="School, community, route, or online platform" value={f.school} onChange={s("school")} />
              <FSelect label="District *" value={f.district} onChange={s("district")}>
                <option value="">Select district...</option>
                {DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}
              </FSelect>
            </div>
            <FSelect label="What are you reporting? *" value={f.curriculum} onChange={s("curriculum")}>
              {["Harassment or intimidation", "Sexual assault or attempted assault", "Defilement or abuse of a child", "Exploitation, coercion, or transactional sex", "Threats, stalking, or retaliation", "Online abuse or image-based abuse", "Unsafe school route or unsafe learning space", "Forced relationship or child marriage concern", "Need referral, counselling, or protection support", "Other SGBV concern"].map(x => <option key={x}>{x}</option>)}
            </FSelect>
            <FSelect label="Who is affected?" value={f.zone} onChange={s("zone")}>
              <option value="">Prefer not to say</option>
              <option>Girl learner</option>
              <option>Boy learner</option>
              <option>Young woman</option>
              <option>Young man</option>
              <option>Adult woman</option>
              <option>Adult man</option>
              <option>Group of learners</option>
              <option>Other / unknown</option>
            </FSelect>
            <FArea label="What happened? *" placeholder="Briefly describe what happened, when it happened, and whether the person is currently safe." value={f.session} onChange={s("session")} />
            <FArea label="Immediate support needed" placeholder="Medical help, police/VSU support, counselling, safe transport, school protection, referral pathway, or other support." value={f.challenges} onChange={s("challenges")} />
            <FArea label="Contact or follow-up note" placeholder="Optional. Add a safe contact method or explain if you prefer not to be contacted." value={f.success} onChange={s("success")} />
            <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
              <Btn onClick={submit}>Send Case Report</Btn>
              <Btn variant="secondary" onClick={() => setF(E)}>Reset</Btn>
            </div>
          </Card>
        </div>
      );

      return (
        // ✅ CENTER WRAPPER ADDED HERE
        <div style={{ maxWidth: 640, margin: "0 auto" }}>
          <Kicker text="Field Reporting" />
          <h1 style={{ margin: "0 0 4px", fontSize: 21, fontWeight: 700 }}>Submit Session Report</h1>
          <p style={{ margin: "0 0 14px", color: "#6b7280", fontSize: 13 }}>{assignedCluster ? `Record attendance and session delivery for ${assignedCluster.name}.` : "Record attendance, session details, challenges and successes after each school visit."}</p>

          {/* TOT stats bar */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
            {[["12", "Schools Reported"], ["4", "Clusters Active"], ["21", "Reports Submitted"]].map(([v, l]) => (
              <div key={l} style={{ background: OR_PALE, borderRadius: 8, padding: "9px", textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: OR }}>{v}</div>
                <div style={{ fontSize: 10, color: OR_D }}>{l}</div>
              </div>
            ))}
          </div>

          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="School Name *" placeholder="e.g. Kawale Primary" value={f.school} onChange={s("school")} />
              <FSelect label="District *" value={f.district} onChange={s("district")}>
                <option value="">Select district…</option>
                {DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}
              </FSelect>
            </div>
            <FInput label={assignedCluster ? "Assigned Cluster *" : "Education Zone *"} placeholder={assignedCluster ? "Assigned cluster" : "e.g. Kawale Zone"} value={f.zone} onChange={s("zone")} readOnly={!!assignedCluster} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="Number of Boys" type="number" placeholder="0" min="0" value={f.boys} onChange={s("boys")} />
              <FInput label="Number of Girls" type="number" placeholder="0" min="0" value={f.girls} onChange={s("girls")} />
            </div>
            <FSelect label="Curriculum *" value={f.curriculum} onChange={s("curriculum")}>
              <option value="HIM">HIM — Hero in Me (Boys)</option>
              <option value="GESD">GESD — Girls Empowerment</option>
              <option value="Combined">Combined Session</option>
            </FSelect>
            <FSelect label="Session Conducted *" value={f.session} onChange={s("session")}>
              <option value="">Select session…</option>
              {(SESSION_LISTS[f.curriculum] || []).map(x => <option key={x}>{x}</option>)}
            </FSelect>
            <FArea label="Challenges Faced" placeholder="Any challenges, low attendance, resource gaps…" value={f.challenges} onChange={s("challenges")} />
            <FArea label="Success Stories" placeholder="Positive outcomes, memorable moments, student engagement…" value={f.success} onChange={s("success")} />
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <Btn onClick={submit}>📤 Submit Report</Btn>
              <Btn variant="secondary" onClick={() => setF(E)}>Reset</Btn>
            </div>
          </Card>

          {/* Pending reports review (for coordinators/admin) */}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // REPORTS PAGE  (with coordinator approve/reject)
    // ─────────────────────────────────────────────
    function ReportsPage({ user, reports, onUpdateStatus, showToast }) {
      const [filt, setFilt] = useState("all");
      const [search, setSearch] = useState("");
      const [sel, setSel] = useState(null);

      const visible = reports.filter(r => {
        if (user.role === "district_coordinator" && r.district !== user.district) return false;
        if ((user.role === "data_entry" || user.role === "tot") && r.submitted_by !== user.name) return false;
        if (filt !== "all" && r.status !== filt) return false;
        const q = search.toLowerCase();
        if (q && !r.school.toLowerCase().includes(q) && !r.district.toLowerCase().includes(q)) return false;
        return true;
      });

      return (
        <div>
          <Kicker text="Reporting" />
          <h1 style={{ margin: "0 0 13px", fontSize: 21, fontWeight: 700 }}>{user.role === "data_entry" ? "My Reports" : "All Session Reports"}</h1>
          <Card>
            <FilterBar
              options={["all", "pending", "approved", "rejected"].map(x => ({ v: x, l: `${x.charAt(0).toUpperCase() + x.slice(1)} (${reports.filter(r => x === "all" ? true : r.status === x).length})` }))}
              active={filt} onChange={setFilt}
              search={search} onSearch={setSearch} searchPlaceholder="Search school or district…"
            />
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                <TH cols={["School", "District", "Curriculum", "Session", "Students", "Status", "Date", "Actions"]} />
                <tbody>
                  {visible.map(r => (
                    <tr key={r.id} style={{ borderBottom: "1px solid #f3f4f6" }}>
                      <td style={{ padding: "7px 9px", fontWeight: 600 }}>{r.school}</td>
                      <td style={{ padding: "7px 9px", color: "#6b7280" }}>{r.district}</td>
                      <td style={{ padding: "7px 9px" }}><Badge text={r.curriculum} /></td>
                      <td style={{ padding: "7px 9px", color: "#6b7280", fontSize: 11, maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.session}</td>
                      <td style={{ padding: "7px 9px" }}>{r.boys + r.girls}</td>
                      <td style={{ padding: "7px 9px" }}><Pill s={r.status} /></td>
                      <td style={{ padding: "7px 9px", color: "#9ca3af", fontSize: 11 }}>{r.submitted_at}</td>
                      <td style={{ padding: "7px 9px" }}>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Btn size="sm" variant="ghost" onClick={() => setSel(r)}>View</Btn>
                          {can(user.role, "approveReport") && r.status === "pending" && <>
                            <Btn size="sm" variant="success" onClick={() => { onUpdateStatus(r.id, "approved"); showToast("✅ Approved"); }}>✓</Btn>
                            <Btn size="sm" variant="danger" onClick={() => { onUpdateStatus(r.id, "rejected"); showToast("Report rejected"); }}>✗</Btn>
                          </>}
                        </div>
                      </td>
                    </tr>
                  ))}
                  {visible.length === 0 && <tr><td colSpan={8} style={{ padding: 20, textAlign: "center", color: "#9ca3af" }}>No reports found</td></tr>}
                </tbody>
              </table>
            </div>
          </Card>
          {sel && (
            <Modal title={`Report: ${sel.school}`} onClose={() => setSel(null)}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 13 }}>
                {[["School", sel.school], ["District", sel.district], ["Zone", sel.zone], ["Curriculum", sel.curriculum], ["Boys", sel.boys], ["Girls", sel.girls], ["Total", sel.boys + sel.girls], ["By", sel.submitted_by], ["Date", sel.submitted_at]].map(([l, v]) => (
                  <div key={l}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase" }}>{l}</div><div style={{ fontSize: 13, fontWeight: 600, marginTop: 2 }}>{v}</div></div>
                ))}
              </div>
              <div style={{ marginBottom: 9 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Session</div><div style={{ fontSize: 12.5 }}>{sel.session}</div></div>
              {sel.challenges && <div style={{ marginBottom: 9 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Challenges</div><div style={{ fontSize: 12.5, background: "#fef9c3", padding: "7px 10px", borderRadius: 6 }}>{sel.challenges}</div></div>}
              {sel.success && <div style={{ marginBottom: 13 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Success Stories</div><div style={{ fontSize: 12.5, background: "#d1fae5", padding: "7px 10px", borderRadius: 6 }}>{sel.success}</div></div>}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <Pill s={sel.status} />
                {can(user.role, "approveReport") && sel.status === "pending" && (
                  <div style={{ display: "flex", gap: 7 }}>
                    <Btn variant="success" onClick={() => { onUpdateStatus(sel.id, "approved"); setSel(null); showToast("✅ Approved"); }}>✅ Approve</Btn>
                    <Btn variant="danger" onClick={() => { onUpdateStatus(sel.id, "rejected"); setSel(null); showToast("Rejected"); }}>Reject</Btn>
                  </div>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // MAPS PAGE  (Leaflet + OpenStreetMap)
    // ─────────────────────────────────────────────
    const CLUSTER_SCHOOLS = [
      {
        clusterId: 0,
        schools: [
          {
            name: "Kawale Primary",
            lat: -13.95,
            lng: 33.80
          },
          {
            name: "Chinsapo Primary",
            lat: -13.93,
            lng: 33.78
          },
          {
            name: "Area 25 Primary",
            lat: -13.98,
            lng: 33.82
          }
        ]
      },

      {
        clusterId: 2,
        schools: [
          {
            name: "Mbayani Primary",
            lat: -15.80,
            lng: 35.02
          },
          {
            name: "Ndirande LEA",
            lat: -15.78,
            lng: 35.01
          },
          {
            name: "Chirimba Primary",
            lat: -15.82,
            lng: 35.03
          }
        ]
      },

      {
        clusterId: 4,
        schools: [
          {
            name: "Zomba LEA",
            lat: -15.39,
            lng: 35.31
          },
          {
            name: "Domasi Primary",
            lat: -15.30,
            lng: 35.28
          }
        ]
      }
    ];
    function MapsPage({ setPage, user, focus }) {

      const [selectedRegion, setSelectedRegion] =
        React.useState("All");

      const [selectedCluster, setSelectedCluster] =
        React.useState(null);

      const [showLegend, setShowLegend] =
        React.useState(true);

      const mapRef = React.useRef(null);

      const regions = [
        "All",
        "Northern",
        "Central",
        "Southern"
      ];

      const clustersWithCoords = CLUSTERS.map(c => {

        const district =
          DISTRICTS.find(
            d => d.name === c.district
          );

        return {
          ...c,
          region: district?.r || "Central",
          lat:
            DISTRICT_INFO[c.district]?.lat || -13.5,
          lng:
            DISTRICT_INFO[c.district]?.lng || 34
        };

      });

      const filteredClusters =
        selectedRegion === "All"
          ? clustersWithCoords
          : clustersWithCoords.filter(
            c => c.region === selectedRegion
          );

      const flyToCluster = cluster => {

        if (!mapRef.current) return;

        mapRef.current.flyTo(
          [cluster.lat, cluster.lng],
          9,
          {
            duration: 2
          }
        );

      };

      React.useEffect(() => {

        if (!window.L) return;

        const map = L.map("ett-map", {
          zoomControl: true
        }).setView([-13.5, 34], 6);

        mapRef.current = map;

        // CARTODB TILE LAYER
        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
          {
            attribution:
              '&copy; OpenStreetMap contributors &copy; CARTO'
          }
        ).addTo(map);

        // SCALE BAR
        L.control
          .scale({
            imperial: false
          })
          .addTo(map);

        // CLUSTER MARKERS
        filteredClusters.forEach(cluster => {

          const color =
            cluster.progress >= 80
              ? "#16a34a"
              : cluster.progress >= 60
                ? "#ea580c"
                : "#dc2626";

          const marker = L.circleMarker(
            [cluster.lat, cluster.lng],
            {
              radius: 11,
              fillColor: color,
              color: "#fff",
              weight: 2,
              fillOpacity: 0.9
            }
          ).addTo(map);

          marker.bindPopup(`
        <div style="min-width:220px;font-family:Arial">
          <h3 style="margin:0 0 6px;font-size:15px;">
            ${cluster.name}
          </h3>

          <div style="font-size:12px;color:#555;margin-bottom:8px;">
            ${cluster.district} District
          </div>

          <div style="margin-bottom:6px;">
            <b>Schools:</b> ${cluster.schools}
          </div>

          <div style="margin-bottom:6px;">
            <b>Students:</b> ${cluster.students}
          </div>

          <div style="margin-bottom:10px;">
            <b>Progress:</b> ${cluster.progress}%
          </div>

          <button
            onclick="window.openClusterModal(${cluster.id})"
            style="
              width:100%;
              border:none;
              background:#ea6c0a;
              color:white;
              padding:8px;
              border-radius:8px;
              cursor:pointer;
              font-weight:bold;
            "
          >
            View Details
          </button>
        </div>
      `);

          marker.on("click", () => {
            flyToCluster(cluster);
          });

        });

        // DISTRICT POINTS
        DISTRICTS.forEach(district => {

          const coords =
            DISTRICT_INFO[district.name];

          if (!coords) return;

          L.circleMarker(
            [coords.lat, coords.lng],
            {
              radius: 5,
              fillColor: "#111827",
              color: "#fff",
              weight: 1,
              fillOpacity: 0.9
            }
          )
            .addTo(map)
            .bindTooltip(district.name);

        });

        // SCHOOL MARKERS + LINES
        CLUSTER_SCHOOLS.forEach(clusterGroup => {

          const cluster =
            clustersWithCoords.find(
              c => c.id === clusterGroup.clusterId
            );

          if (!cluster) return;

          const schoolPoints = [];

          clusterGroup.schools.forEach(school => {

            schoolPoints.push([
              school.lat,
              school.lng
            ]);

            // SCHOOL MARKER
            L.circleMarker(
              [school.lat, school.lng],
              {
                radius: 7,
                fillColor: "#2563eb",
                color: "#fff",
                weight: 2,
                fillOpacity: 1
              }
            )
              .addTo(map)
              .bindPopup(`
            <div style="font-family:Arial">
              <b>${school.name}</b><br/>
              Cluster: ${cluster.name}
            </div>
          `);

            // LINE TO CLUSTER
            L.polyline(
              [
                [cluster.lat, cluster.lng],
                [school.lat, school.lng]
              ],
              {
                color: "#94a3b8",
                weight: 2,
                opacity: 0.7,
                dashArray: "5,5"
              }
            ).addTo(map);

          });

          // CONNECT SCHOOLS
          if (schoolPoints.length > 1) {

            L.polyline(
              schoolPoints,
              {
                color: "#2563eb",
                weight: 3,
                opacity: 0.5
              }
            ).addTo(map);

          }

        });

        return () => {
          map.remove();
        };

      }, [selectedRegion]);

      window.openClusterModal = id => {

        const cluster =
          clustersWithCoords.find(
            c => c.id === id
          );

        setSelectedCluster(cluster);

      };

      return (
        <div>

          <div
            style={{
              display: "grid",
              gridTemplateColumns: "320px 1fr",
              gap: 14
            }}
            data-map-grid
          >

            {/* SIDEBAR */}
            <div
              style={{
                background: "#fff",
                borderRadius: 16,
                border: "1px solid #eee",
                padding: 16,
                maxHeight: "82vh",
                overflowY: "auto",
                boxShadow:
                  "0 10px 24px rgba(0,0,0,.06)"
              }}
            >

              <h2
                style={{
                  marginTop: 0
                }}
              >
                Malawi Clusters
              </h2>

              {/* REGION FILTER */}
              <div
                style={{
                  display: "flex",
                  gap: 6,
                  flexWrap: "wrap",
                  marginBottom: 18
                }}
              >
                {regions.map(region => (

                  <button
                    key={region}
                    onClick={() =>
                      setSelectedRegion(region)
                    }
                    style={{
                      border: "none",
                      background:
                        selectedRegion === region
                          ? "#ea6c0a"
                          : "#f3f4f6",
                      color:
                        selectedRegion === region
                          ? "#fff"
                          : "#111",
                      padding: "8px 12px",
                      borderRadius: 20,
                      cursor: "pointer",
                      fontWeight: 700
                    }}
                  >
                    {region}
                  </button>

                ))}
              </div>

              {/* CLUSTERS */}
              <div
                style={{
                  display: "flex",
                  flexDirection: "column",
                  gap: 10
                }}
              >

                {filteredClusters.map(cluster => (

                  <div
                    key={cluster.id}
                    onClick={() => {
                      flyToCluster(cluster);
                      setSelectedCluster(cluster);
                    }}
                    style={{
                      padding: 14,
                      borderRadius: 12,
                      border: "1px solid #eee",
                      cursor: "pointer",
                      background: "#fff"
                    }}
                  >

                    <div
                      style={{
                        fontWeight: 700
                      }}
                    >
                      {cluster.name}
                    </div>

                    <div
                      style={{
                        fontSize: 12,
                        color: "#666",
                        marginTop: 4
                      }}
                    >
                      {cluster.district}
                    </div>

                  </div>

                ))}

              </div>

            </div>

            {/* MAP */}
            <div
              style={{
                position: "relative"
              }}
            >

              <div
                id="ett-map"
                style={{
                  width: "100%",
                  height: "82vh",
                  borderRadius: 18,
                  overflow: "hidden"
                }}
              />

              {/* LEGEND */}
              <div
                style={{
                  position: "absolute",
                  top: 14,
                  right: 14,
                  zIndex: 1000
                }}
              >

                <button
                  onClick={() =>
                    setShowLegend(!showLegend)
                  }
                  style={{
                    background: "#fff",
                    border: "none",
                    padding: "10px 14px",
                    borderRadius: 10,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  Legend
                </button>

                {showLegend && (

                  <div
                    style={{
                      marginTop: 10,
                      background: "#fff",
                      padding: 14,
                      borderRadius: 12,
                      width: 180
                    }}
                  >

                    {[
                      {
                        color: "#16a34a",
                        label: "High Progress"
                      },
                      {
                        color: "#ea580c",
                        label: "Medium Progress"
                      },
                      {
                        color: "#dc2626",
                        label: "Low Progress"
                      }
                    ].map(item => (

                      <div
                        key={item.label}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 10,
                          marginBottom: 10
                        }}
                      >

                        <div
                          style={{
                            width: 14,
                            height: 14,
                            borderRadius: "50%",
                            background: item.color
                          }}
                        />

                        <span>
                          {item.label}
                        </span>

                      </div>

                    ))}

                  </div>

                )}

              </div>

            </div>

          </div>

          {/* MODAL */}
          {selectedCluster && (

            <Modal
              title={selectedCluster.name}
              onClose={() =>
                setSelectedCluster(null)
              }
              width={500}
            >

              <div
                style={{
                  display: "grid",
                  gap: 16
                }}
              >

                <div>
                  <b>District:</b>{" "}
                  {selectedCluster.district}
                </div>

                <div>
                  <b>Schools:</b>{" "}
                  {selectedCluster.schools}
                </div>

                <div>
                  <b>Students:</b>{" "}
                  {selectedCluster.students}
                </div>

                <div>
                  <b>Progress:</b>{" "}
                  {selectedCluster.progress}%
                </div>

              </div>

            </Modal>

          )}

        </div>
      );

    }

    // ─────────────────────────────────────────────

        <div>
          <Kicker text={user.role === "tot" ? "My Assigned Cluster" : "Cluster Management"} />

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(135px,1fr))", gap: 9, marginBottom: 16 }}>

                  <div style={{ fontWeight: 800, fontSize: 13.5, marginBottom: 2, color: BLACK }}>{c.name}</div>

              </Card>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // DISTRICTS
    // ─────────────────────────────────────────────
    function DistrictsPage({ user, onOpenMap }) {
      const [region, setRegion] = useState("all");
      const filtered = DISTRICTS.filter(d => (region === "all" || d.r === region) && (!(user?.role === "tot") || d.name === user.district));
      return (
        <div>
          <Kicker text="All 28 Districts" />
          <h1 style={{ margin: "0 0 6px", fontSize: 24, fontWeight: 800, color: BLACK }}>{user?.role === "tot" ? "My District" : "Implementing Districts"}</h1>

          <FilterBar options={["all", "Northern", "Central", "Southern"].map(r => ({ v: r, l: r === "all" ? "All Regions" : r }))} active={region} onChange={setRegion} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(180px,1fr))", gap: 9 }}>

    function TrainingsPage() {
      const [filt, setFilt] = useState("all");
      const pm = { active: { c: OR_D, bg: OR_PALE }, upcoming: { c: "#92400e", bg: "#fef9c3" }, completed: { c: "#6b7280", bg: "#f3f4f6" } };
      const visible = filt === "all" ? TRAININGS : TRAININGS.filter(t => t.s === filt);
      return (
        <div>
          <Kicker text="Training Management" />
          <h1 style={{ margin: "0 0 13px", fontSize: 21, fontWeight: 700 }}>Current Trainings</h1>

          </div>
          <FilterBar options={["all", "active", "upcoming", "completed"].map(x => ({ v: x, l: x.charAt(0).toUpperCase() + x.slice(1) }))} active={filt} onChange={setFilt} />
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>

              const pct = t.s === "completed" ? 100 : t.s === "upcoming" ? 0 : Math.round((t.day / 6) * 100);
              const m = pm[t.s];
              return (
                <Card key={t.name}>
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 9 }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 2 }}>{t.name}</div>

                      <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 2 }}>🏛️ {t.venue} · 👩‍🏫 {t.trainers}</div>
                    </div>
                    <Badge text={t.s === "active" ? "In Progress" : t.s.charAt(0).toUpperCase() + t.s.slice(1)} color={m.c} bg={m.bg} />
                  </div>
                  {t.s !== "upcoming" && (
                    <>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#9ca3af", marginBottom: 3 }}>
                        <span>{t.s === "completed" ? "Complete" : "Day " + t.day + " of 6"}</span><span>{pct}%</span>
                      </div>
                      <ProgBar pct={pct} />
                      <div style={{ display: "flex", gap: 4, marginTop: 7 }}>
                        {Array.from({ length: 6 }, (_, i) => {
                          const n = i + 1;
                          const cls = t.s === "completed" ? "done" : n < t.day ? "done" : n === t.day ? "today" : "";
                          const bg = cls === "done" ? OR : cls === "today" ? OR_D : "#f1f5f9";
                          const color = cls ? "#fff" : "#9ca3af";
                          return <div key={n} style={{ width: 22, height: 22, borderRadius: "50%", background: bg, color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, border: `2px solid ${cls ? bg : "#e5e7eb"}` }}>{n}</div>;

                      </div>
                    </>
                  )}
                </Card>
              );
            })}
          </div>
        </div>
      );
