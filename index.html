    const ICONS = {

      users: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
      impact: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,

    };
    const NavIcon = ({ id }) => <span dangerouslySetInnerHTML={{ __html: ICONS[id] || ICONS.overview }} style={{ display: "inline-flex", alignItems: "center", flexShrink: 0 }} />;

    // ─── NAV CONFIG ──────────────────────────────
    const NAV_GROUPS = {

        { group: "Program", items: [{ id: "maps", l: "Maps", i: "maps" }, { id: "clusters", l: "School Clusters", i: "clusters" }, { id: "districts", l: "Districts", i: "districts" }, { id: "trainings", l: "Trainings", i: "trainings" }, { id: "curriculum", l: "Digital Curriculum", i: "curriculum" }, { id: "ett", l: "ETT Training", i: "ett" }] },

        { group: "My Cluster", items: [{ id: "clusters", l: "Assigned Cluster", i: "clusters" }, { id: "maps", l: "Cluster Map", i: "maps" }, { id: "districts", l: "District", i: "districts" }, { id: "curriculum", l: "Digital Curriculum", i: "curriculum" }, { id: "ett", l: "ETT Training", i: "ett" }] },

    const PUBLIC_NAV = [
      { group: "ETT Malawi", items: [{ id: "dashboard", l: "Public Dashboard", i: "overview" }, { id: "maps", l: "Coverage Map", i: "maps" }, { id: "impact", l: "Impact Stories", i: "star" }, { id: "trainings", l: "Trainings", i: "trainings" }, { id: "curriculum", l: "Digital Curriculum", i: "curriculum" }, { id: "submit", l: "Report a Case", i: "shield" }] }
    ];

    const PAGE_LABELS = { dashboard: "Dashboard", submit: "Report a Case", reports: "All Reports", my_reports: "My Reports", maps: "Maps", clusters: "School Clusters", districts: "Districts", trainings: "Trainings", curriculum: "Digital Curriculum", ett: "ETT Training", analytics: "Analytics", users: "User Management", impact: "Reports & Impact", about: "About", login: "Sign In" };

    // ─── LOGIN ───────────────────────────────────
    function LoginPage({ onLogin, onPublicView, onRegister }) {
      const [mode, setMode] = useState("choice");
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState("");
      const [reg, setReg] = useState({ name: "", district: "", designation: "", email: "", school: "", cluster: "", password: "" });

      const doLogin = async () => {
        if (!email || !pass) { setErr("Please enter email and password"); return; }
        setLoading(true);
        await new Promise(r => setTimeout(r, 500));
        const allUsers = [...USERS_INIT, ...(JSON.parse(localStorage.getItem("ett_users") || "[]"))];
        const u = allUsers.find(x => x.email === email && x.password === pass);
        setLoading(false);
        if (!u) { setErr("Invalid email or password"); return; }
        onLogin(u);
      };

      const createAccount = () => {
        if (!reg.name || !reg.district || !reg.designation || !reg.email || !reg.password) { setErr("Please fill all mandatory fields"); return; }
        const users = JSON.parse(localStorage.getItem("ett_users") || "[]");
        if (users.find(u => u.email === reg.email)) { setErr("Account already exists"); return; }
        const newUser = { id: Date.now().toString(), name: reg.name, district: reg.district, designation: reg.designation, email: reg.email, school: reg.school, cluster: reg.cluster, password: reg.password, role: "viewer", avatar: reg.name.split(" ").map(x => x[0]).join("").toUpperCase() };
        users.push(newUser);
        localStorage.setItem("ett_users", JSON.stringify(users));
        onRegister(newUser);
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#fff", padding: 16 }}>
          <div style={{ width: "100%", maxWidth: 400, background: "#fff", borderRadius: 20, padding: "36px 32px", boxShadow: "0 4px 32px rgba(15,22,35,.10)", border: "1px solid #e8ecf2" }}>
            <div style={{ textAlign: "center", marginBottom: 28 }}>
              <AfricaLogo size={52} variant="black" />
              <h1 style={{ margin: "14px 0 4px", fontSize: "18px !important", fontWeight: 800, color: BLACK }}>ETT Malawi</h1>
              <p style={{ color: "#9ca3af", fontSize: 12, margin: 0 }}>Ujamaa Pamodzi Africa</p>
            </div>
            {mode === "choice" && (<>
              <Btn full onClick={() => setMode("login")} style={{ marginBottom: 10 }}>Sign In</Btn>
              <Btn full variant="secondary" onClick={() => setMode("register")} style={{ marginBottom: 10 }}>Create Account</Btn>
              <Btn full variant="ghost" onClick={onPublicView}>View Public Dashboard</Btn>
            </>)}
            {mode === "login" && (<>
              <h2 style={{ marginBottom: 20, fontSize: 16, fontWeight: 700, color: BLACK }}>Sign In to Your Account</h2>
              <FInput label="Email address" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@ujamaa.mw" />
              <FInput label="Password" type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••" />
              {err && <div style={{ background: "#fee2e2", color: "#991b1b", padding: "9px 12px", borderRadius: 8, marginBottom: 12, fontSize: 12, fontWeight: 600 }}>{err}</div>}
              <Btn full onClick={doLogin} disabled={loading} style={{ marginBottom: 10 }}>{loading ? "Signing In..." : "Sign In"}</Btn>
              <Btn full variant="ghost" onClick={() => setMode("choice")}>← Back</Btn>
            </>)}
            {mode === "register" && (<>
              <h2 style={{ marginBottom: 18, fontSize: 16, fontWeight: 700, color: BLACK }}>Create Account</h2>
              <FInput label="Full Name *" value={reg.name} onChange={e => setReg({ ...reg, name: e.target.value })} />
              <FSelect label="District *" value={reg.district} onChange={e => setReg({ ...reg, district: e.target.value })}><option value="">Select district</option>{DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}</FSelect>
              <FInput label="Designation *" value={reg.designation} onChange={e => setReg({ ...reg, designation: e.target.value })} />
              <FInput label="Email *" type="email" value={reg.email} onChange={e => setReg({ ...reg, email: e.target.value })} />
              <FInput label="School Name" value={reg.school} onChange={e => setReg({ ...reg, school: e.target.value })} />
              <FInput label="Cluster Name" value={reg.cluster} onChange={e => setReg({ ...reg, cluster: e.target.value })} />
              <FInput label="Password *" type="password" value={reg.password} onChange={e => setReg({ ...reg, password: e.target.value })} />
              {err && <div style={{ background: "#fee2e2", color: "#991b1b", padding: 10, borderRadius: 8, marginBottom: 12, fontSize: 12 }}>{err}</div>}
              <Btn full onClick={createAccount} style={{ marginBottom: 10 }}>Create Account</Btn>
              <Btn full variant="ghost" onClick={() => setMode("choice")}>← Back</Btn>
            </>)}
          </div>
        </div>
      );
    }

    // ─── SIDEBAR ─────────────────────────────────
    function Sidebar({ page, setPage, user, onLogout, open, onClose }) {
      const groups = user ? (NAV_GROUPS[user.role] || []) : PUBLIC_NAV;
      const rc = user ? ROLE_CFG[user.role] : null;
      const [isMobile, setIsMobile] = useState(window.innerWidth <= 820);
      useEffect(() => {
        const handle = () => setIsMobile(window.innerWidth <= 820);
        window.addEventListener('resize', handle);
        return () => window.removeEventListener('resize', handle);
      }, []);
      if (page !== "dashboard") return null;
      if (!open) return null;
      return (
        <>
          <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(15,22,35,0.5)", zIndex: 998, animation: "fadeIn .2s ease" }} />
          <div style={{ position: "fixed", ...(isMobile ? { top: 0, left: 0, bottom: 0, width: "82vw", maxWidth: 300, animation: "slideInLeft .25s ease" } : { top: 64, left: 0, right: 0, width: "100%", maxHeight: "85vh", animation: "slideInDown .22s ease" }), background: `linear-gradient(160deg,${SIDEBAR_A} 0%,${SIDEBAR_B} 100%)`, zIndex: 999, display: "flex", flexDirection: isMobile ? "column" : "row", overflowY: "auto", boxShadow: isMobile ? "6px 0 32px rgba(0,0,0,.4)" : "0 12px 40px rgba(15,22,35,.35)", borderRadius: isMobile ? "0 20px 20px 0" : "0 0 20px 20px" }}>
            {isMobile && (
              <div style={{ padding: "18px 16px 14px", borderBottom: "1px solid rgba(255,255,255,.08)", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <AfricaLogo size={32} />
                  <div><div style={{ fontSize: 14, fontWeight: 800, color: "#fff" }}>{APP_NAME}</div><div style={{ fontSize: 10, color: "rgba(255,255,255,.4)" }}>Ujamaa Pamodzi Africa</div></div>
                </div>
                <button onClick={onClose} style={{ background: "rgba(255,255,255,.08)", border: "none", borderRadius: 8, width: 32, height: 32, fontSize: 16, cursor: "pointer", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
              </div>
            )}
            {/* CHANGE 2: Desktop sidebar nav — items centered horizontally */}
            <nav style={{
              flex: 1,
              display: "flex",
              flexDirection: isMobile ? "column" : "row",
              flexWrap: isMobile ? "nowrap" : "wrap",
              padding: isMobile ? "8px 0" : "10px 20px",
              gap: isMobile ? 0 : 2,
              overflowY: isMobile ? "auto" : "visible",
              alignItems: isMobile ? "stretch" : "center",
              justifyContent: isMobile ? "flex-start" : "center",
            }}>
              {groups.map(g => (
                <div key={g.group} style={{ display: "flex", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 0 : 1 }}>
                  {isMobile && <div style={{ padding: "10px 16px 3px", fontSize: 9.5, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", color: "rgba(255,255,255,.35)" }}>{g.group}</div>}
                  {g.items.map(item => (
                    <div key={item.id} onClick={() => { setPage(item.id); onClose(); }} style={{ display: "flex", alignItems: "center", gap: isMobile ? 10 : 7, padding: isMobile ? "10px 14px" : "8px 13px", margin: isMobile ? "1px 8px" : "0 1px", borderRadius: 10, fontSize: isMobile ? 13 : 12.5, fontWeight: 600, color: "rgba(255,255,255,.72)", cursor: "pointer", background: "transparent", transition: "all .14s", whiteSpace: "nowrap" }} onMouseEnter={e => { e.currentTarget.style.background = "rgba(232,93,4,.25)"; e.currentTarget.style.color = "#fff"; }} onMouseLeave={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "rgba(255,255,255,.72)"; }}>
                      <NavIcon id={item.i} />{item.l}
                    </div>
                  ))}
                  {isMobile && <div style={{ height: 1, background: "rgba(255,255,255,.06)", margin: "4px 12px" }} />}
                </div>
              ))}
            </nav>
            {isMobile && (
              <div style={{ padding: "12px 14px 16px", borderTop: "1px solid rgba(255,255,255,.08)", flexShrink: 0 }}>
                {!user ? (<Btn full onClick={() => { setPage("login"); onClose(); }}>Sign In</Btn>) : (
                  <>
                    <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 10 }}>
                      <div style={{ width: 32, height: 32, borderRadius: "50%", background: OR, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{user.avatar}</div>
                      <div style={{ minWidth: 0 }}><div style={{ fontSize: 12, fontWeight: 700, color: "#fff", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{user.name}</div><Badge text={rc.label} color={rc.color} bg={rc.bg} /></div>
                    </div>
                    <button onClick={() => { onLogout(); onClose(); }} style={{ width: "100%", padding: "7px", borderRadius: 8, border: "none", background: OR_PALE, color: OR_D, fontSize: 12, cursor: "pointer", fontFamily: "inherit", fontWeight: 700 }}>Sign Out</button>
                  </>
                )}
                <button style={{ width: "100%", padding: "6px", borderRadius: 8, border: "none", background: "rgba(220,38,38,.15)", color: "#fca5a5", fontSize: 11, cursor: "pointer", fontFamily: "inherit", marginTop: 6 }}>🆘 Child Helpline: 116</button>
              </div>
            )}
          </div>
        </>
      );
    }

    // ─── DASHBOARD ───────────────────────────────
    function Dashboard({ user, reports, setPage }) {
      const currentUser = user || { role: "viewer", name: "Public Viewer", district: null };
      const isPublic = !user;
      const my = (currentUser.role === "data_entry" || currentUser.role === "tot") ? reports.filter(r => r.submitted_by === currentUser.name) : currentUser.role === "district_coordinator" ? reports.filter(r => r.district === currentUser.district) : reports;
      const pending = my.filter(r => r.status === "pending").length;
      const approved = my.filter(r => r.status === "approved").length;
      const students = my.reduce((a, r) => a + r.boys + r.girls, 0);
      const rc = ROLE_CFG[currentUser.role];

      const YEARLY_DATA = [
        { year: "2023", schools: 116, teachers: 228, learners: 45600, targetSchools: 225, targetLearners: 45000 },
        { year: "2024", schools: 357, teachers: 727, learners: 145400, targetSchools: 950, targetLearners: 190000 },
        { year: "2025", schools: 975, teachers: 1973, learners: 395000, targetSchools: 3000, targetLearners: 600000 },
        { year: "2026", schools: 1482, teachers: 2964, learners: 592200, targetSchools: 6000, targetLearners: 1200000, current: true },
        { year: "2027", schools: 0, teachers: 0, learners: 0, targetSchools: 10000, targetLearners: 2000000, planned: true },
      ];

      const SUMMARY_BADGES = [
        { label: "Total Clusters", value: "396", color: "#854f0b", pale: "#faeeda" },
        { label: "TOTs", value: "665", color: "#185fa5", pale: "#e6f1fb" },
        { label: "Cluster Teachbacks", value: "288", color: "#0f6e56", pale: "#e1f5ee" },
        { label: "Cluster Meetings", value: "371", color: "#8b5cf6", pale: "#f5f3ff" },
        { label: "Senior TOTs", value: "70", color: "#534ab7", pale: "#eeedfe" },
      ];

      const C_BLUE = "#378ADD";
      const C_GREEN = "#1D9E75";
      const C_AMBER = "#BA7517";
      const C_GRID = "rgba(0,0,0,0.05)";
      const C_TICK = "#9ca3af";

      const chartRefs = React.useRef({});

      React.useEffect(() => {
        if (typeof Chart === "undefined") return;

        const kill = (id) => {
          if (chartRefs.current[id]) {
            chartRefs.current[id].destroy();
            delete chartRefs.current[id];
          }
        };

        const buildCharts = () => {
          const lineCtx = document.getElementById("up-line-learners");
          if (lineCtx) {
            kill("line-learners");
            chartRefs.current["line-learners"] = new Chart(lineCtx, {
              type: "line",
              data: {
                labels: YEARLY_DATA.map(d => d.year),
                datasets: [
                  { label: "Actual learners", data: YEARLY_DATA.map(d => d.learners), borderColor: C_BLUE, backgroundColor: "rgba(55,138,221,0.08)", fill: true, tension: 0.35, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: C_BLUE },
                  { label: "Target learners", data: YEARLY_DATA.map(d => d.targetLearners), borderColor: C_AMBER, backgroundColor: "rgba(186,117,23,0.06)", fill: true, borderDash: [5, 4], tension: 0.35, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: C_AMBER },
                ]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true, position: "top", labels: { font: { size: 11 }, color: C_TICK } }, tooltip: { mode: "index", intersect: false } },
                scales: {
                  x: { grid: { display: false }, ticks: { color: C_TICK, font: { size: 11 } } },
                  y: { grid: { color: C_GRID }, ticks: { color: C_TICK, font: { size: 11 } } },
                },
              },
            });
          }

          const barYearCtx = document.getElementById("up-bar-year");
          if (barYearCtx) {
            kill("bar-year");
            chartRefs.current["bar-year"] = new Chart(barYearCtx, {
              type: "bar",
              data: {
                labels: YEARLY_DATA.map(d => d.year),
                datasets: [
                  { label: "Schools reached", data: YEARLY_DATA.map(d => d.schools), backgroundColor: C_BLUE, borderRadius: 4 },
                  { label: "Teachers trained", data: YEARLY_DATA.map(d => d.teachers), backgroundColor: C_GREEN, borderRadius: 4 },
                ]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true, position: "top", labels: { font: { size: 11 }, color: C_TICK } }, tooltip: { mode: "index", intersect: false } },
                scales: {
                  x: { grid: { display: false }, ticks: { color: C_TICK, font: { size: 11 } } },
                  y: { grid: { color: C_GRID }, ticks: { color: C_TICK, font: { size: 11 } } },
                },
              },
            });
          }
        };

        const raf = requestAnimationFrame(buildCharts);
        return () => {
          cancelAnimationFrame(raf);
          Object.keys(chartRefs.current).forEach(kill);
        };
      }, []);

      const S = {
        card: { background: "#ffffff", border: "1px solid #e8ecf2", borderRadius: 16, padding: "20px 22px", boxSizing: "border-box", boxShadow: "0 2px 12px rgba(15,22,35,.05)" },
        label: { fontSize: 11.5, color: "#9ca3af", marginBottom: 4, fontWeight: 500 },
        value: { fontSize: 22, fontWeight: 800, color: "#111827", letterSpacing: "-0.5px" },
        sub: { fontSize: 10.5, color: "#c4c4c4", marginTop: 3 },
        hr: { border: "none", borderTop: "1px solid #f0f2f6", margin: "10px 0" },
        eyebrow: { fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.4, color: OR, marginBottom: 5 },
      };

      return (
        <div>
          <div style={{ background: `linear-gradient(135deg, ${BLACK} 0%, #1a2535 60%, #1f2f45 100%)`, border: "none", borderRadius: 24, padding: "48px 36px", color: "#fff", margin: "0 auto 28px auto", position: "relative", overflow: "hidden", boxShadow: "0 20px 50px rgba(15,22,35,.25)", textAlign: "center", maxWidth: 1300 }}>
            <div style={{ position: "absolute", top: -80, right: -80, width: 300, height: 300, borderRadius: "50%", background: "rgba(232,93,4,.10)" }} />
            <div style={{ position: "absolute", bottom: -60, left: -60, width: 220, height: 220, borderRadius: "50%", background: "rgba(232,93,4,.06)" }} />
            <div style={{ position: "relative", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <div style={{ fontSize: 11, color: OR, textTransform: "uppercase", letterSpacing: 2, marginBottom: 12, fontWeight: 700, background: "rgba(232,93,4,.12)", padding: "4px 14px", borderRadius: 20, display: "inline-block" }}>{user ? "Welcome back" : "National Program Dashboard"}</div>
              <h1 style={{ margin: "0 0 14px", fontSize: "clamp(2.8rem,5.2vw,5.2rem)", lineHeight: 1.05, fontWeight: 800, letterSpacing: "1.5px", maxWidth: 900, color: "#fff" }}>{user ? currentUser.name : "ETT Country Wide ScaleUp Program"}</h1>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, flexWrap: "wrap", marginBottom: 28 }}>
                <span style={{ background: "rgba(232,93,4,.15)", border: "1px solid rgba(232,93,4,.25)", color: OR, padding: "6px 16px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 6 }}>🌍 {user ? rc.label : "Public access"}</span>
                {currentUser.district && <span style={{ fontSize: 12.5, color: "rgba(255,255,255,.55)" }}>📍 {currentUser.district}</span>}
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
                {isPublic ? (<>
                  <Btn onClick={() => setPage("maps")} size="lg">View Coverage Map</Btn>
                  <Btn onClick={() => setPage("impact")} variant="ghost" size="lg" style={{ background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,.15)", color: "#fff" }}>Impact Stories</Btn>
                  <Btn onClick={() => setPage("submit")} variant="ghost" size="lg" style={{ background: "rgba(255,255,255,.05)", border: "1px solid rgba(255,255,255,.1)", color: "rgba(255,255,255,.75)" }}>Report a Case</Btn>
                  <Btn onClick={() => setPage("login")} size="lg" style={{ background: "rgba(255,255,255,.12)", border: "1px solid rgba(255,255,255,.18)", color: "#fff", boxShadow: "none" }}>Staff Login</Btn>
                </>) : (<>
                  <Btn onClick={() => setPage("submit")} size="lg">Submit Report</Btn>
                  {can(user.role, "approveReport") && pending > 0 && <Btn onClick={() => setPage("reports")} size="lg" style={{ background: "rgba(255,255,255,.1)", border: "1px solid rgba(255,255,255,.15)", color: "#fff", boxShadow: "none" }}>Review ({pending})</Btn>}
                  {can(user.role, "manageUsers") && <Btn onClick={() => setPage("users")} size="lg" style={{ background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,.12)", color: "#fff", boxShadow: "none" }}>Manage Users</Btn>}
                </>)}
              </div>
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 14, marginBottom: 28 }}>
            {isPublic ? (<>
              <StatCard icon="👨‍🎓" label="Learners Reached" value="592,200+" />
              <StatCard icon="🏫" label="Schools Covered" value="2,964" />
              <StatCard icon="📍" label="Districts Active" value="15" />
              <StatCard icon="🎓" label="TOTs Trained" value="665" />
              <StatCard icon="📘" label="Sessions Conducted" value="17,784+" />
              <StatCard icon="🌍" label="Coverage Progress" value="54%" />
            </>) : (<>
              <StatCard icon="📋" label="Reports" value={my.length} />
              <StatCard icon="⏳" label="Pending" value={pending} />
              <StatCard icon="✅" label="Approved" value={approved} />
              <StatCard icon="👨‍🎓" label="Students" value={students} />
            </>)}
          </div>

          {isPublic && (
            <Card style={{ marginBottom: 24 }}>
              <SH title="Program Overview" />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(260px,1fr))", gap: 18, alignItems: "stretch" }}>
                {[
                  { icon: "👦", title: "Boys Transformation (HIM)", text: "Empowers boys to challenge harmful gender norms, embrace positive masculinity, respect women and girls, and safely intervene against violence through behavior change and experiential learning.", color: "#e8f4f8" },
                  { icon: "👧", title: "Girls Empowerment (GESD)", text: "A prevention program that combines physical, verbal techniques, verbal assertiveness and psychological awareness — it equips girls to develop boundaries and resist assault or harassment.", color: "#fdf2f8" },
                  { icon: "🍇", title: "Sexual Assault Survivors Anonymous (SASA)", text: "Strengthen referral pathways and linkage through psychological support from breaking the silence.", color: "#f0f9f0" },
                ].map((item, i) => (
                  <div key={i} style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: 20, padding: "20px", display: "flex", alignItems: "flex-start", gap: 16, boxSizing: "border-box", transition: "all .2s ease", cursor: "pointer", boxShadow: "0 2px 4px rgba(0,0,0,0.02)", width: "100%", minWidth: 0 }} onMouseEnter={e => { e.currentTarget.style.boxShadow = "0 8px 20px rgba(0,0,0,0.08)"; e.currentTarget.style.transform = "translateY(-2px)"; }} onMouseLeave={e => { e.currentTarget.style.boxShadow = "0 2px 4px rgba(0,0,0,0.02)"; e.currentTarget.style.transform = "translateY(0)"; }}>
                    <div style={{ width: 52, minWidth: 52, height: 52, borderRadius: 16, background: item.color, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26 }}>{item.icon}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6, color: "#111827" }}>{item.title}</div>
                      <div style={{ fontSize: 13.5, lineHeight: 1.55, color: "#6b7280" }}>{item.text}</div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(340px,1fr))", gap: 20, alignItems: "start", width: "100%" }}>
            {!isPublic && (
              <Card style={{ overflow: "hidden", width: "100%", minWidth: 0, padding: "20px 0 0 0" }}>
                <div style={{ padding: "0 20px" }}>
                  <SH title="Recent Reports" action={user ? <Btn size="sm" variant="secondary" onClick={() => setPage(user.role === "data_entry" ? "my_reports" : "reports")}>View All →</Btn> : <Btn size="sm" variant="secondary" onClick={() => setPage("login")}>Sign In →</Btn>} />
                </div>
                <div style={{ overflowX: "auto", width: "100%", marginTop: 8 }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 700, fontSize: 13 }}>
                    <TH cols={["School", "District", "Curriculum", "Students", "Status", "Date"]} />
                    <tbody>
                      {my.slice(0, 5).map(r => (
                        <tr key={r.id} style={{ borderBottom: "1px solid #f3f4f6" }} onMouseEnter={e => { e.currentTarget.style.background = "#fafafa"; }} onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}>
                          <td style={{ padding: "14px 12px", fontWeight: 600, whiteSpace: "nowrap" }}>{r.school}</td>
                          <td style={{ padding: "14px 12px", color: "#6b7280" }}>{r.district}</td>
                          <td style={{ padding: "14px 12px" }}><Badge text={r.curriculum} /></td>
                          <td style={{ padding: "14px 12px", color: "#6b7280", fontWeight: 500 }}>{r.boys + r.girls}</td>
                          <td style={{ padding: "14px 12px" }}><Pill s={r.status} /></td>
                          <td style={{ padding: "14px 12px", color: "#9ca3af", fontSize: 11, whiteSpace: "nowrap" }}>{r.submitted_at}</td>
                        </tr>
                      ))}
                      {my.length === 0 && <tr><td colSpan={6} style={{ padding: 48, textAlign: "center", color: "#9ca3af", fontSize: 14 }}>📭 No reports yet</td></tr>}
                    </tbody>
                  </table>
                </div>
              </Card>
            )}

            <div style={{ marginTop: 0, width: "100%" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
                <div>
                  <div style={S.eyebrow}>Ujamaa Pamodzi · Numbers Tracking</div>
                  <div style={{ fontSize: 20, fontWeight: 800, color: "#111827" }}>Transition to Scale-Up</div>
                </div>
                <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
                  {SUMMARY_BADGES.map(b => (
                    <span key={b.label} style={{ background: b.pale, color: b.color, padding: "4px 12px", borderRadius: 999, fontSize: 11, fontWeight: 700 }}>{b.value} {b.label}</span>
                  ))}
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 12, marginBottom: 24, alignItems: "stretch" }}>
                {YEARLY_DATA.map(d => (
                  <div key={d.year} style={{ ...S.card, border: d.current ? "1.5px solid #378ADD" : "1px solid #f0f0f0", background: d.planned ? "#fafafa" : "#fff" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: d.planned ? "#c4c4c4" : "#185fa5" }}>{d.year}</span>
                      {d.current && <span style={{ fontSize: 9, fontWeight: 700, background: "#e6f1fb", color: "#185fa5", padding: "2px 7px", borderRadius: 999 }}>Current</span>}
                      {d.planned && <span style={{ fontSize: 9, fontWeight: 700, background: "#f3f4f6", color: "#9ca3af", padding: "2px 7px", borderRadius: 999 }}>Planned</span>}
                    </div>
                    <div style={S.label}>Schools reached</div>
                    <div style={{ ...S.value, fontSize: 18, color: d.planned ? "#c4c4c4" : "#111827" }}>{d.schools.toLocaleString()}</div>
                    <hr style={S.hr} />
                    <div style={S.label}>Teachers trained</div>
                    <div style={{ ...S.value, fontSize: 18 }}>{d.teachers.toLocaleString()}</div>
                    <hr style={S.hr} />
                    <div style={S.label}>Learners trained</div>
                    <div style={{ ...S.value, fontSize: 18 }}>{d.learners.toLocaleString()}</div>
                    <div style={S.sub}>target {d.targetSchools.toLocaleString()} schools · {d.targetLearners.toLocaleString()} learners</div>
                  </div>
                ))}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(320px,1fr))", gap: 20, marginBottom: 20 }}>
                <div style={S.card}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#111827", marginBottom: 2 }}>Learners Trained vs Target</div>
                  <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 12 }}>Actual vs target across all years</div>
                  <div style={{ position: "relative", width: "100%", height: "220px" }}>
                    <canvas id="up-line-learners" style={{ display: "block" }}></canvas>
                  </div>
                </div>
                <div style={S.card}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#111827", marginBottom: 2 }}>Schools Reached & Teachers Trained</div>
                  <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 12 }}>Annual totals across transition period</div>
                  <div style={{ position: "relative", width: "100%", height: "220px" }}>
                    <canvas id="up-bar-year" style={{ display: "block" }}></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div style={{ marginTop: 32, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(300px,1fr))", gap: 20, alignItems: "stretch", width: "100%" }}>
            <Card style={{ padding: "20px" }}>
              <SH title="Quick Actions" />
              <div style={{ display: "grid", gap: 12, marginTop: 8 }}>
                <Btn onClick={() => setPage("submit")} full style={{ fontWeight: 600, padding: "12px 16px" }}>📝 {user ? "Submit Report" : "Report Case"}</Btn>
                {user && <Btn variant="secondary" onClick={() => setPage("curriculum")} full style={{ fontWeight: 500, padding: "12px 16px" }}>📘 Curriculum</Btn>}
                <Btn variant="ghost" onClick={() => setPage("maps")} full style={{ fontWeight: 500, padding: "12px 16px" }}>🗺️ View Maps</Btn>
                {user && <Btn variant="ghost" onClick={() => setPage("analytics")} full style={{ fontWeight: 500, padding: "12px 16px" }}>📊 Analytics</Btn>}
              </div>
            </Card>

            <Card style={{ background: "linear-gradient(135deg,#fff7ef 0%,#fffbf5 100%)", border: "1px solid #fde7cf", padding: "20px", position: "relative", overflow: "hidden" }}>
              <div style={{ position: "absolute", top: -20, right: -20, fontSize: 80, opacity: 0.08, pointerEvents: "none" }}>🆘</div>
              <div style={{ fontSize: 12, fontWeight: 800, textTransform: "uppercase", letterSpacing: 1, color: "#92400e", marginBottom: 14 }}>⚡ Emergency Contacts</div>

    // ─── SUBMIT REPORT ───────────────────────────
    function SubmitReport({ user, onSubmit, showToast }) {
      const isPublic = !user;
      const assignedCluster = user?.role === "tot" ? CLUSTERS.find(c => c.id === user.clusterId) : null;
      const E = isPublic ? { school: "", district: "", zone: "", boys: "", girls: "", curriculum: "Harassment or intimidation", session: "", challenges: "", success: "" } : { school: "", district: user?.district || "", zone: assignedCluster?.name || "", boys: "", girls: "", curriculum: "HIM", session: "", challenges: "", success: "" };
      const [f, setF] = useState(E);
      const [done, setDone] = useState(false);
      const s = k => e => setF(p => ({ ...p, [k]: e.target.value }));

      const submit = () => {
        if (isPublic) {
          if (!f.school || !f.district || !f.session) { showToast("Please fill in the required case details"); return; }
          onSubmit({ ...f, boys: parseInt(f.boys) || 0, girls: parseInt(f.girls) || 0, zone: f.zone || "Not specified", status: "pending", submitted_by: "Public case report", submitted_at: new Date().toISOString().split("T")[0] });
          setDone(true); showToast("Case report sent for safe review"); return;
        }
        if (!f.school || !f.district || !f.zone || !f.session) { showToast("⚠️ Please fill in all required fields"); return; }
        onSubmit({ ...f, boys: parseInt(f.boys) || 0, girls: parseInt(f.girls) || 0, status: "pending", submitted_by: user.name, submitted_at: new Date().toISOString().split("T")[0] });
        setDone(true); showToast("✅ Report submitted — awaiting review");
      };

      if (done) return (
        <div style={{ maxWidth: 440, margin: "0 auto", textAlign: "center", padding: 36 }}>
          <div style={{ fontSize: 52, marginBottom: 10 }}>✅</div>
          <h2 style={{ margin: "0 0 8px", fontSize: 18, fontWeight: 700 }}>{isPublic ? "Case Report Sent" : "Report Submitted!"}</h2>
          <p style={{ color: "#6b7280", fontSize: 13, marginBottom: 18 }}>{isPublic ? "Thank you. If someone is in immediate danger, call Ujamaa Helpline 0984 110 288, Child Helpline 116 or VSU Police 997 now." : "Pending review by your District Coordinator or National Admin."}</p>
          <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
            <Btn onClick={() => { setF(E); setDone(false); }}>{isPublic ? "Report Another Case" : "Submit Another"}</Btn>
            <Btn variant="secondary" onClick={() => setDone(false)}>Back</Btn>
          </div>
        </div>
      );

      if (isPublic) return (
        <div style={{ maxWidth: 760, margin: "0 auto" }}>
          <Kicker text="Safe Reporting" />
          <h1 style={{ margin: "0 0 4px", fontSize: 23, fontWeight: 800, color: BLACK }}>Report a Case</h1>
          <p style={{ margin: "0 0 14px", color: "#4b5563", fontSize: 13, lineHeight: 1.6 }}>Use this page to report suspected or confirmed SGBV concerns safely.</p>
          <Card style={{ background: BLACK, color: "#fff", border: "none", marginBottom: 14 }}>
            <div style={{ fontSize: 12.5, lineHeight: 1.7 }}><b>You can report:</b> sexual harassment, assault, defilement, exploitation, coercion, threats, bullying linked to gender, unsafe school routes, online abuse, forced relationships, child marriage concerns, or urgent protection and referral needs.</div>
            <div style={{ fontSize: 11.5, color: "rgba(255,255,255,.68)", marginTop: 8 }}>Emergency contacts: Child Helpline 116 · VSU Police 997 · Ujamaa Helpline 0984 110 288</div>
          </Card>
          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="Where did it happen? *" placeholder="School, community, route, or online platform" value={f.school} onChange={s("school")} />
              <FSelect label="District *" value={f.district} onChange={s("district")}><option value="">Select district...</option>{DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}</FSelect>
            </div>
            <FSelect label="What are you reporting? *" value={f.curriculum} onChange={s("curriculum")}>
              {["Harassment or intimidation", "Sexual assault or attempted assault", "Defilement or abuse of a child", "Exploitation, coercion, or transactional sex", "Threats, stalking, or retaliation", "Online abuse or image-based abuse", "Unsafe school route or unsafe learning space", "Forced relationship or child marriage concern", "Need referral, counselling, or protection support", "Other SGBV concern"].map(x => <option key={x}>{x}</option>)}
            </FSelect>
            <FSelect label="Who is affected?" value={f.zone} onChange={s("zone")}>
              <option value="">Prefer not to say</option><option>Girl learner</option><option>Boy learner</option><option>Young woman</option><option>Young man</option><option>Adult woman</option><option>Adult man</option><option>Group of learners</option><option>Other / unknown</option>
            </FSelect>
            <FArea label="What happened? *" placeholder="Briefly describe what happened, when it happened, and whether the person is currently safe." value={f.session} onChange={s("session")} />
            <FArea label="Immediate support needed" placeholder="Medical help, police/VSU support, counselling, safe transport, school protection, referral pathway, or other support." value={f.challenges} onChange={s("challenges")} />
            <FArea label="Contact or follow-up note" placeholder="Optional. Add a safe contact method or explain if you prefer not to be contacted." value={f.success} onChange={s("success")} />
            <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
              <Btn onClick={submit}>Send Case Report</Btn>
              <Btn variant="secondary" onClick={() => setF(E)}>Reset</Btn>
            </div>
          </Card>
        </div>
      );

      return (
        <div style={{ maxWidth: 640, margin: "0 auto" }}>
          <Kicker text="Field Reporting" />
          <h1 style={{ margin: "0 0 4px", fontSize: 21, fontWeight: 700 }}>Submit Session Report</h1>
          <p style={{ margin: "0 0 10px", color: "#6b7280", fontSize: 13 }}>{assignedCluster ? `Record attendance and session delivery for ${assignedCluster.name}.` : "Record attendance, session details, challenges and successes after each school visit."}</p>
          {/* Routing info banner */}
          {(() => { const w = getReportRecipient(user.role); return w.sendTo ? (
            <div style={{ background: OR_PALE, border: "1px solid #f5d0aa", borderRadius: 8, padding: "8px 14px", marginBottom: 12, fontSize: 12, color: OR_D, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
              📨 Your report will be sent to: <strong>{w.label}</strong>
            </div>
          ) : null; })()}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 }}>
            {[["12", "Schools Reported"], ["4", "Clusters Active"], ["21", "Reports Submitted"]].map(([v, l]) => (
              <div key={l} style={{ background: OR_PALE, borderRadius: 8, padding: "9px", textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: OR }}>{v}</div>
                <div style={{ fontSize: 10, color: OR_D }}>{l}</div>
              </div>
            ))}
          </div>
          <Card>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="School Name *" placeholder="e.g. Kawale Primary" value={f.school} onChange={s("school")} />
              <FSelect label="District *" value={f.district} onChange={s("district")}><option value="">Select district…</option>{DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}</FSelect>
            </div>
            <FInput label={assignedCluster ? "Assigned Cluster *" : "Education Zone *"} placeholder={assignedCluster ? "Assigned cluster" : "e.g. Kawale Zone"} value={f.zone} onChange={s("zone")} readOnly={!!assignedCluster} />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
              <FInput label="Number of Boys" type="number" placeholder="0" min="0" value={f.boys} onChange={s("boys")} />
              <FInput label="Number of Girls" type="number" placeholder="0" min="0" value={f.girls} onChange={s("girls")} />
            </div>
            <FSelect label="Curriculum *" value={f.curriculum} onChange={s("curriculum")}>
              <option value="HIM">HIM — Hero in Me (Boys)</option>
              <option value="GESD">GESD — Girls Empowerment</option>
              <option value="Combined">Combined Session</option>
            </FSelect>
            <FSelect label="Session Conducted *" value={f.session} onChange={s("session")}>
              <option value="">Select session…</option>
              {(SESSION_LISTS[f.curriculum] || []).map(x => <option key={x}>{x}</option>)}
            </FSelect>
            <FArea label="Challenges Faced" placeholder="Any challenges, low attendance, resource gaps…" value={f.challenges} onChange={s("challenges")} />
            <FArea label="Success Stories" placeholder="Positive outcomes, memorable moments, student engagement…" value={f.success} onChange={s("success")} />
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <Btn onClick={submit}>📤 Submit Report</Btn>
              <Btn variant="secondary" onClick={() => setF(E)}>Reset</Btn>
            </div>
          </Card>
        </div>
      );
    }

    // ─── REPORTS PAGE ────────────────────────────
    function ReportsPage({ user, reports, onUpdateStatus, showToast, onEditReport, onForwardReport }) {
      const [filt, setFilt] = useState("all");
      const [search, setSearch] = useState("");
      const [sel, setSel] = useState(null);

      const workflow = getReportRecipient(user.role);

      const visible = reports.filter(r => {
        if (user.role === "district_coordinator" && r.district !== user.district) return false;
        if ((user.role === "data_entry" || user.role === "tot") && r.submitted_by !== user.name) return false;
        if (filt !== "all" && r.status !== filt) return false;
        const q = search.toLowerCase();
        if (q && !r.school.toLowerCase().includes(q) && !r.district.toLowerCase().includes(q)) return false;
        return true;
      });

      return (
        <div>
          <Kicker text="Reporting" />
          <h1 style={{ margin: "0 0 6px", fontSize: 21, fontWeight: 700 }}>{user.role === "data_entry" ? "My Reports" : "All Session Reports"}</h1>

          {/* Workflow banner */}
          <div style={{ background: OR_PALE, border: `1px solid #f5d0aa`, borderRadius: 10, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 10, fontSize: 12, fontWeight: 600, color: OR_D, flexWrap: "wrap" }}>
            <span>📋 Workflow:</span>
            {["tot","viewer","data_entry"].includes(user.role) && <><span style={{ background: OR_D, color:"#fff", padding:"2px 9px", borderRadius:20 }}>You</span><span>→</span><span style={{ background:"#e0f2fe", color:"#0369a1", padding:"2px 9px", borderRadius:20 }}>District Coordinator</span><span>→</span><span style={{ background:"#d1fae5", color:"#065f46", padding:"2px 9px", borderRadius:20 }}>Admin</span></>}
            {user.role === "district_coordinator" && <><span style={{ background:"#e0f2fe", color:"#0369a1", padding:"2px 9px", borderRadius:20 }}>District Coordinator</span><span>→</span><span style={{ background:"#d1fae5", color:"#065f46", padding:"2px 9px", borderRadius:20 }}>National Admin</span></>}
            {user.role === "admin" && <><span style={{ background:"#d1fae5", color:"#065f46", padding:"2px 9px", borderRadius:20 }}>National Admin — Final Recipient</span></>}
            {user.role === "data_entry" && <span style={{ marginLeft:"auto", color:"#6b7280", fontWeight:500 }}>✏️ You can edit report data</span>}
          </div>

          <Card>
            <FilterBar options={["all", "pending", "approved", "rejected", "forwarded"].map(x => ({ v: x, l: `${x.charAt(0).toUpperCase() + x.slice(1)} (${reports.filter(r => x === "all" ? true : r.status === x).length})` }))} active={filt} onChange={setFilt} search={search} onSearch={setSearch} searchPlaceholder="Search school or district…" />
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                <TH cols={["School", "District", "Curriculum", "Session", "Students", "Status", "Sent To", "Actions"]} />
                <tbody>
                  {visible.map(r => (
                    <tr key={r.id} style={{ borderBottom: "1px solid #f3f4f6" }}>
                      <td style={{ padding: "7px 9px", fontWeight: 600 }}>{r.school}</td>
                      <td style={{ padding: "7px 9px", color: "#6b7280" }}>{r.district}</td>
                      <td style={{ padding: "7px 9px" }}><Badge text={r.curriculum} /></td>
                      <td style={{ padding: "7px 9px", color: "#6b7280", fontSize: 11, maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.session}</td>
                      <td style={{ padding: "7px 9px" }}>{r.boys + r.girls}</td>
                      <td style={{ padding: "7px 9px" }}><Pill s={r.status} /></td>
                      <td style={{ padding: "7px 9px", fontSize: 10.5, color: "#6b7280" }}>{r.sentToLabel || "—"}</td>
                      <td style={{ padding: "7px 9px" }}>
                        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                          <Btn size="sm" variant="ghost" onClick={() => setSel(r)}>View</Btn>
                          {/* Data Officer: edit button */}
                          {user.role === "data_entry" && (
                            <Btn size="sm" variant="ghost" style={{ background:"#eff6ff", color:"#1e40af", border:"1px solid #bfdbfe" }} onClick={() => onEditReport(r)}>✏️ Edit</Btn>
                          )}
                          {/* Approve/Reject for admin & district_coordinator */}
                          {can(user.role, "approveReport") && r.status === "pending" && <>
                            <Btn size="sm" variant="success" onClick={() => { onUpdateStatus(r.id, "approved"); showToast("✅ Approved"); }}>✓</Btn>
                            <Btn size="sm" variant="danger" onClick={() => { onUpdateStatus(r.id, "rejected"); showToast("Report rejected"); }}>✗</Btn>
                          </>}
                          {/* District Coordinator: forward to Admin */}
                          {user.role === "district_coordinator" && r.status === "approved" && r.sentTo !== "admin" && (
                            <Btn size="sm" style={{ background:"#e0f2fe", color:"#0369a1", border:"1px solid #bae6fd", fontWeight:700 }} onClick={() => onForwardReport(r)}>📨 Forward</Btn>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                  {visible.length === 0 && <tr><td colSpan={8} style={{ padding: 20, textAlign: "center", color: "#9ca3af" }}>No reports found</td></tr>}
                </tbody>
              </table>
            </div>
          </Card>
          {sel && (
            <Modal title={`Report: ${sel.school}`} onClose={() => setSel(null)}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 13 }}>
                {[["School", sel.school], ["District", sel.district], ["Zone", sel.zone], ["Curriculum", sel.curriculum], ["Boys", sel.boys], ["Girls", sel.girls], ["Total", sel.boys + sel.girls], ["By", sel.submitted_by], ["Date", sel.submitted_at], ["Sent To", sel.sentToLabel || "—"]].map(([l, v]) => (
                  <div key={l}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase" }}>{l}</div><div style={{ fontSize: 13, fontWeight: 600, marginTop: 2 }}>{v}</div></div>
                ))}
              </div>
              <div style={{ marginBottom: 9 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Session</div><div style={{ fontSize: 12.5 }}>{sel.session}</div></div>
              {sel.challenges && <div style={{ marginBottom: 9 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Challenges</div><div style={{ fontSize: 12.5, background: "#fef9c3", padding: "7px 10px", borderRadius: 6 }}>{sel.challenges}</div></div>}
              {sel.success && <div style={{ marginBottom: 13 }}><div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", marginBottom: 3 }}>Success Stories</div><div style={{ fontSize: 12.5, background: "#d1fae5", padding: "7px 10px", borderRadius: 6 }}>{sel.success}</div></div>}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                <Pill s={sel.status} />
                <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
                  {can(user.role, "approveReport") && sel.status === "pending" && (
                    <>
                      <Btn variant="success" onClick={() => { onUpdateStatus(sel.id, "approved"); setSel(null); showToast("✅ Approved"); }}>✅ Approve</Btn>
                      <Btn variant="danger" onClick={() => { onUpdateStatus(sel.id, "rejected"); setSel(null); showToast("Rejected"); }}>Reject</Btn>
                    </>
                  )}
                  {user.role === "district_coordinator" && sel.status === "approved" && sel.sentTo !== "admin" && (
                    <Btn style={{ background:"#e0f2fe", color:"#0369a1", border:"1px solid #bae6fd", fontWeight:700 }} onClick={() => { onForwardReport(sel); setSel(null); }}>📨 Forward to Admin</Btn>
                  )}
                  {user.role === "data_entry" && (
                    <Btn variant="ghost" style={{ background:"#eff6ff", color:"#1e40af", border:"1px solid #bfdbfe" }} onClick={() => { onEditReport(sel); setSel(null); }}>✏️ Edit Data</Btn>
                  )}
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

      {

    function MapsPage({ setPage, user, focus }) {
      const [selectedRegion, setSelectedRegion] = React.useState("All");
      const [activeClusterId, setActiveClusterId] = React.useState(null);
      const [selectedCluster, setSelectedCluster] = React.useState(null);
      const mapRef = React.useRef(null);
      const regions = ["All", "Northern", "Central", "Southern"];

      const clustersWithRegion = MAP_CLUSTERS.map(c => {
        const d = DISTRICTS.find(x => x.name === c.district);
        return { ...c, region: d?.r || "Central" };
      });
      const filteredClusters = selectedRegion === "All"
        ? clustersWithRegion
        : clustersWithRegion.filter(c => c.region === selectedRegion);

      const flyToCluster = React.useCallback((cluster) => {
        if (!mapRef.current) return;
        setActiveClusterId(cluster.id);
        const pts = [[cluster.lat, cluster.lng], ...cluster.schools.map(s => [s.lat, s.lng])];
        mapRef.current.flyToBounds(pts, { padding: [55, 55], maxZoom: 13, duration: 1.2 });
      }, []);

      React.useEffect(() => {
        if (!window.L) return;
        const map = L.map("ett-map", { zoomControl: true }).setView([-13.2, 34.0], 7);
        mapRef.current = map;
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          maxZoom: 18
        }).addTo(map);
        L.control.scale({ imperial: false }).addTo(map);

        DISTRICTS.forEach(district => {
          const coords = DISTRICT_INFO[district.name];
          if (!coords) return;
          const isActive = ACTIVE_DISTRICTS.has(district.name);
          const fillColor = isActive ? "#16a34a" : "#9ca3af";
          const radius   = isActive ? 7 : 5;
          L.circleMarker([coords.lat, coords.lng], {
            radius, fillColor, color: "#fff", weight: 2, fillOpacity: isActive ? 0.9 : 0.65
          }).addTo(map).bindTooltip(district.name, {
            permanent: false, direction: "top",
            className: "",
            offset: [0, -6]
          });
        });

        filteredClusters.forEach(cluster => {
          cluster.schools.forEach(school => {
            L.polyline([[cluster.lat, cluster.lng], [school.lat, school.lng]], {
              color: "#e85d04", weight: 2.2, opacity: 0.75, dashArray: "6 5"
            }).addTo(map);
          });

          cluster.schools.forEach(school => {
            const schoolIcon = L.divIcon({
              className: "",
              html: `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer">
                <div style="width:12px;height:12px;border-radius:50%;background:#e85d04;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);flex-shrink:0"></div>
                <div style="background:rgba(255,255,255,.97);color:#c44d00;border:1px solid #e85d04;border-radius:4px;padding:2px 6px;font-size:9.5px;font-weight:700;font-family:'Plus Jakarta Sans',Arial,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:130px;overflow:hidden;text-overflow:ellipsis;line-height:1.3">${school.name}</div>
              </div>`,
              iconAnchor: [6, 0]
            });
            L.marker([school.lat, school.lng], { icon: schoolIcon, zIndexOffset: 200 })
              .addTo(map)
              .bindPopup(
                `<div style="font-family:'Plus Jakarta Sans',Arial,sans-serif;min-width:185px;padding:2px 0">
                  <div style="font-weight:800;font-size:13px;margin-bottom:3px;color:#0f1623">${school.name}</div>
                  <div style="font-size:11px;color:#6b7280;margin-bottom:4px">
                    <span style="color:#e85d04">●</span> ${cluster.district} &nbsp;·&nbsp; Lead: <b>${cluster.lead}</b>
                  </div>
                  <div style="font-size:11px;color:#6b7280;margin-bottom:4px">📞 <a href="tel:${cluster.leadPhone}" style="color:#e85d04;text-decoration:none;font-weight:700">${cluster.leadPhone}</a></div>
                  <span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;background:#fff1e6;color:#c44d00">✅ ETT Trained</span>
                </div>`,
                { maxWidth: 220 }
              );
          });

          const clusterIcon = L.divIcon({
            className: "",
            html: `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer">
              <div style="width:14px;height:14px;border-radius:50%;background:#0f1623;border:3px solid #e85d04;box-shadow:0 2px 8px rgba(0,0,0,.45);flex-shrink:0"></div>
              <div style="background:#0f1623;color:#fff;border:2px solid #e85d04;border-radius:8px;padding:3px 8px;font-size:10px;font-weight:700;font-family:'Plus Jakarta Sans',Arial,sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);line-height:1.3">${cluster.name.replace(" Cluster","")}</div>
            </div>`,
            iconAnchor: [0, 7]
          });

          const schoolListHTML = cluster.schools.map(s =>
            `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #f3f4f6">
              <span style="width:8px;height:8px;border-radius:50%;background:#e85d04;flex-shrink:0;display:inline-block"></span>
              <span style="font-size:11.5px;color:#374151">${s.name}</span>
            </div>`
          ).join("");

          const clusterMarker = L.marker([cluster.lat, cluster.lng], { icon: clusterIcon, zIndexOffset: 500 }).addTo(map);
          clusterMarker.bindPopup(
            `<div style="font-family:'Plus Jakarta Sans',Arial,sans-serif;min-width:240px;padding:2px 0">
              <div style="font-weight:800;font-size:15px;margin-bottom:5px;color:#0f1623">${cluster.name}</div>
              <div style="font-size:11.5px;color:#6b7280;margin-bottom:4px;display:flex;align-items:center;gap:5px">
                <span style="color:#e85d04">📍</span> ${cluster.district} &nbsp;·&nbsp; Lead: <b>${cluster.lead}</b>
              </div>
              <div style="font-size:11.5px;color:#6b7280;margin-bottom:8px;display:flex;align-items:center;gap:5px">
                <span>📞</span> <a href="tel:${cluster.leadPhone}" style="color:#e85d04;text-decoration:none;font-weight:700">${cluster.leadPhone}</a>
              </div>
              <div style="font-size:11.5px;color:#374151;margin-bottom:8px;display:flex;align-items:center;gap:5px">
                <span>🎓</span> <b>${cluster.students.toLocaleString()}</b> students &nbsp;·&nbsp; ${cluster.trained}/${cluster.schools.length} trained
              </div>
              <div style="background:#e5e7eb;border-radius:3px;height:4px;margin-bottom:10px;overflow:hidden">
                <div style="background:#e85d04;height:100%;width:${Math.round(cluster.trained/cluster.schools.length*100)}%;border-radius:3px"></div>
              </div>
              <div style="font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9ca3af;margin-bottom:5px">Schools in this Cluster</div>
              ${schoolListHTML}
            </div>`,
            { maxWidth: 280 }
          );
          clusterMarker.on("click", () => {
            setActiveClusterId(cluster.id);
          });
        });

        return () => { map.remove(); mapRef.current = null; };
      }, [selectedRegion]);

      window.openClusterModal = id => {
        const cluster = MAP_CLUSTERS.find(c => c.id === id);
        setSelectedCluster(cluster);
        setActiveClusterId(id);
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
          <div style={{ marginBottom: 12 }}>
            <Kicker text="Interactive Map" />
            <h1 style={{ margin: "0 0 0", fontSize: 22, fontWeight: 800, color: BLACK }}>Primary School Clusters — Malawi</h1>
          </div>

          <div style={{ background: "#fff", border: "1px solid #e8ecf2", borderRadius: "12px 12px 0 0", padding: "9px 18px", display: "flex", flexWrap: "wrap", gap: 18, alignItems: "center", fontSize: 12, fontWeight: 600 }}>
            {[
              { color: "#16a34a", label: "Active District" },
              { color: "#9ca3af", label: "Inactive District" },
              { color: "#e85d04", label: "School (ETT Trained)" },
              { color: "#0f1623", border: "#e85d04", label: "Cluster Centre" },
            ].map(item => (
              <span key={item.label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 11, height: 11, borderRadius: "50%", background: item.color, border: item.border ? `2px solid ${item.border}` : "2px solid #fff", display: "inline-block", flexShrink: 0, boxShadow: "0 1px 3px rgba(0,0,0,.2)" }} />
                {item.label}
              </span>
            ))}
            <span style={{ marginLeft: "auto", fontSize: 11, color: "#9ca3af", fontWeight: 500 }}>Click any cluster or school marker to explore</span>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 0, border: "1px solid #e8ecf2", borderRadius: "0 0 16px 16px", overflow: "hidden", height: "75vh" }} data-map-grid>
            <div style={{ background: "#fff", borderRight: "1px solid #e8ecf2", display: "flex", flexDirection: "column", overflow: "hidden" }}>
              <div style={{ padding: "10px 10px 8px", borderBottom: "1px solid #f0f2f6", flexShrink: 0 }}>
                <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", color: "#9ca3af", marginBottom: 6 }}>Filter by Region</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {regions.map(region => (
                    <button key={region} onClick={() => setSelectedRegion(region)} style={{ border: "none", background: selectedRegion === region ? OR : "#f4f6fa", color: selectedRegion === region ? "#fff" : "#374151", padding: "4px 10px", borderRadius: 20, cursor: "pointer", fontWeight: 700, fontSize: 11, transition: "all .14s" }}>{region}</button>
                  ))}
                </div>
              </div>
              <div style={{ overflowY: "auto", flex: 1, padding: "8px 8px" }}>
                <div style={{ fontSize: 9.5, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", color: "#9ca3af", padding: "4px 6px 8px", borderBottom: "1px solid #f0f2f6", marginBottom: 6 }}>
                  Clusters ({filteredClusters.length})
                </div>
                {filteredClusters.map(cluster => {
                  const isActive = activeClusterId === cluster.id;
                  return (
                    <div
                      key={cluster.id}
                      onClick={() => { flyToCluster(cluster); setSelectedCluster(cluster); }}
                      style={{
                        padding: "9px 10px", borderRadius: 8,
                        border: `1px solid ${isActive ? OR : "#e8ecf2"}`,
                        background: isActive ? OR_PALE : "#fafbfd",
                        cursor: "pointer", marginBottom: 5, transition: "all .14s",
                      }}
                      onMouseEnter={e => { if (!isActive) { e.currentTarget.style.borderColor = OR; e.currentTarget.style.background = "#fff8f2"; } }}
                      onMouseLeave={e => { if (!isActive) { e.currentTarget.style.borderColor = "#e8ecf2"; e.currentTarget.style.background = "#fafbfd"; } }}
                    >
                      <div style={{ fontWeight: 700, fontSize: 11.5, color: isActive ? OR_D : BLACK, marginBottom: 2, lineHeight: 1.3 }}>{cluster.name}</div>
                      <div style={{ fontSize: 10.5, color: "#6b7280" }}>
                        📍 {cluster.district} &nbsp;·&nbsp; {cluster.schools.length} schools
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div id="ett-map" style={{ width: "100%", height: "100%" }} />
          </div>

          {selectedCluster && (
            <Modal title={selectedCluster.name} onClose={() => setSelectedCluster(null)} width={480}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
                {[
                  ["District", selectedCluster.district],
                  ["Region", DISTRICTS.find(d => d.name === selectedCluster.district)?.r || "—"],
                  ["Schools", selectedCluster.schools.length],
                  ["Students", selectedCluster.students.toLocaleString()],
                  ["TOTs Trained", selectedCluster.trained],
                  ["Lead", selectedCluster.lead],
                  ["Lead Phone", selectedCluster.leadPhone],
                ].map(([l, v]) => (
                  <div key={l} style={{ background: "#f8fafc", borderRadius: 9, padding: "10px 12px" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: .5, marginBottom: 3 }}>{l}</div>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: BLACK }}>{v}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginBottom: 4 }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: .5, marginBottom: 8 }}>Schools in this Cluster</div>
                {selectedCluster.schools.map((s, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid #f3f4f6" }}>
                    <span style={{ width: 9, height: 9, borderRadius: "50%", background: OR, flexShrink: 0, display: "inline-block" }} />
                    <span style={{ fontSize: 13, color: "#374151" }}>{s.name}</span>
                  </div>
                ))}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ─── CLUSTERS ────────────────────────────────
    function ClustersPage({ user, onOpenMap, setPage }) {
      const list = user.role === "tot" ? CLUSTERS.filter(c => c.id === user.clusterId) : user.role === "district_coordinator" ? CLUSTERS.filter(c => c.district === user.district) : CLUSTERS;
      return (
        <div>
          <Kicker text={user.role === "tot" ? "My Assigned Cluster" : "Cluster Management"} />
          <h1 style={{ margin: "0 0 6px", fontSize: 24, fontWeight: 800, color: BLACK }}>{user.role === "tot" ? "My School Cluster" : "School Clusters"}</h1>
          <p style={{ margin: "0 0 14px", fontSize: 12.5, color: "#6b7280" }}>Select a cluster to view its location on the live Malawi map.</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(135px,1fr))", gap: 9, marginBottom: 16 }}>
            <StatCard icon="🏫" label="Clusters" value={127} /><StatCard icon="🏛️" label="Schools" value={378} /><StatCard icon="👨‍🎓" label="Students" value="7,620" /><StatCard icon="📈" label="Avg Progress" value="69%" />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(245px,1fr))", gap: 9 }}>
            {list.map(c => (
              <Card key={c.id} style={{ borderLeft: `4px solid ${OR}`, cursor: "pointer", transition: "transform .15s,box-shadow .15s" }} onClick={() => onOpenMap({ type: "cluster", id: c.id, name: c.name, ts: Date.now() })} onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = "0 18px 36px rgba(59,38,33,.14)"; }} onMouseLeave={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = "0 6px 20px rgba(17,17,17,.04)"; }}>
                <div style={{ display: "flex", justifyContent: "space-between", gap: 8, alignItems: "flex-start" }}>
                  <div style={{ fontWeight: 800, fontSize: 13.5, marginBottom: 2, color: BLACK }}>{c.name}</div>
                  <Badge text={user.role === "tot" ? "Assigned" : "Map"} color={OR_D} bg={OR_PALE} />
                </div>
                <div style={{ fontSize: 11.5, color: "#6b7280", marginBottom: 9 }}>📍 {c.district} · Lead: {c.lead}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 5, marginBottom: 9 }}>
                  {[["Schools", c.schools], ["Students", c.students.toLocaleString()], ["Trained", c.trained]].map(([l, v]) => (
                    <div key={l} style={{ textAlign: "center", background: "#fafaf9", borderRadius: 6, padding: "5px 4px" }}>
                      <div style={{ fontSize: 15, fontWeight: 700, color: OR }}>{v}</div>
                      <div style={{ fontSize: 9.5, color: "#9ca3af" }}>{l}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#6b7280", marginBottom: 3 }}><span>Progress</span><span style={{ fontWeight: 700, color: OR }}>{c.progress}%</span></div>
                <ProgBar pct={c.progress} />
                {user.role === "tot" && <Btn size="sm" style={{ marginTop: 10 }} onClick={(e) => { e.stopPropagation(); setPage("submit"); }}>Submit Cluster Report</Btn>}
              </Card>
            ))}
          </div>
        </div>
      );
    }

    // ─── DISTRICTS PAGE (CHANGE 3) ────────────────────────────────────────────
    function DistrictsPage({ user, onOpenMap }) {
      const [region, setRegion] = useState("all");
      const [selectedDistrict, setSelectedDistrict] = useState(null);

      const filtered = DISTRICTS.filter(d =>
        (region === "all" || d.r === region) &&
        (!(user?.role === "tot") || d.name === user.district)
      );

      const regionColors = { Northern: { c: "#1e40af", bg: "#dbeafe" }, Central: { c: OR_D, bg: OR_PALE }, Southern: { c: "#065f46", bg: "#d1fae5" } };

      return (
        <div>
          <Kicker text="All 28 Districts" />
          {/* CHANGE 3a: new heading and description */}
          <h1 style={{ margin: "0 0 4px", fontSize: 24, fontWeight: 800, color: BLACK }}>
            {user?.role === "tot" ? "My District" : "Implementing Districts"}
          </h1>
          <p style={{ margin: "0 0 18px", fontSize: 13, color: "#6b7280", lineHeight: 1.6, maxWidth: 680 }}>
            Overview of all Malawian districts and their ETT program implementation status. Select a district to open it on the live Malawi map.
          </p>

          {/* Summary stat strip */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: 10, marginBottom: 20 }}>
            <StatCard icon="🗺️" label="Total Districts" value={DISTRICTS.length} />
            <StatCard icon="✅" label="Active Districts" value={DISTRICTS.filter(d => d.s === "Active").length} color="#16a34a" />
            <StatCard icon="⏳" label="Planned Districts" value={DISTRICTS.filter(d => d.s === "Planned").length} color="#9ca3af" />
            <StatCard icon="🎓" label="Total TOTs" value={DISTRICTS.reduce((a, d) => a + d.tots, 0)} />
            <StatCard icon="👨‍🏫" label="Teachers Trained" value={DISTRICTS.reduce((a, d) => a + d.teachersTrained, 0).toLocaleString()} />
          </div>

          <FilterBar
            options={["all", "Northern", "Central", "Southern"].map(r => ({ v: r, l: r === "all" ? "All Regions" : r }))}
            active={region}
            onChange={setRegion}
          />

          {/* CHANGE 3b: enhanced district cards */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(210px,1fr))", gap: 12 }}>
            {filtered.map(d => {
              const pct = d.schools ? Math.round(d.cov / d.schools * 100) : 0;
              const isActive = d.s === "Active";
              const statusColor = isActive ? OR_D : "#6b7280";
              const statusBg = isActive ? OR_PALE : "#f3f4f6";
              const rc = regionColors[d.r] || { c: "#6b7280", bg: "#f3f4f6" };

              return (
                <div
                  key={d.name}
                  onClick={() => onOpenMap({ type: "district", name: d.name, ts: Date.now() })}
                  style={{
                    background: "#fff",
                    border: `1px solid ${isActive ? "#e8d5c4" : "#e8ecf2"}`,
                    borderTop: `3px solid ${isActive ? OR : "#d1d5db"}`,
                    borderRadius: 14,
                    padding: "16px 14px",
                    cursor: "pointer",
                    transition: "transform .13s, box-shadow .13s",
                    boxShadow: "0 2px 8px rgba(15,22,35,.05)",
                  }}
                  onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = "0 12px 28px rgba(59,38,33,.12)"; }}
                  onMouseLeave={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = "0 2px 8px rgba(15,22,35,.05)"; }}
                >
                  {/* Header row */}
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: 14, color: BLACK, marginBottom: 2 }}>{d.name}</div>
                      <span style={{ padding: "2px 8px", borderRadius: 20, fontSize: 10, fontWeight: 700, color: rc.c, background: rc.bg }}>{d.r}</span>
                    </div>
                    <span style={{ padding: "3px 9px", borderRadius: 20, fontSize: 10.5, fontWeight: 700, color: statusColor, background: statusBg, whiteSpace: "nowrap" }}>
                      {isActive ? "● Active" : "○ Planned"}
                    </span>
                  </div>

                  {/* Key data grid */}
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 10 }}>
                    {[
                      ["👥 Population", d.population],
                      ["📚 Ed. Zones", d.zones],
                      ["🎓 TOTs", d.tots],
                      ["👨‍🏫 Teachers Trained", d.teachersTrained],
                    ].map(([label, val]) => (
                      <div key={label} style={{ background: "#f8fafc", borderRadius: 8, padding: "7px 8px" }}>
                        <div style={{ fontSize: 9.5, color: "#9ca3af", fontWeight: 600, marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{label}</div>
                        <div style={{ fontSize: 13, fontWeight: 800, color: isActive ? OR_D : "#9ca3af" }}>{val || "—"}</div>
                      </div>
                    ))}
                  </div>

                  {/* School coverage — only for active districts */}
                  {isActive ? (
                    <div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#6b7280", marginBottom: 4 }}>
                        <span style={{ fontWeight: 600 }}>School Coverage</span>
                        <span style={{ fontWeight: 800, color: OR_D }}>{d.cov}/{d.schools} ({pct}%)</span>
                      </div>
                      <ProgBar pct={pct} />
                    </div>
                  ) : (
                    <div style={{ padding: "6px 10px", background: "#f9fafb", borderRadius: 8, fontSize: 11, color: "#9ca3af", fontWeight: 600, textAlign: "center" }}>
                      Implementation pending
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* District detail modal */}

              </FSelect>
