    // ─────────────────────────────────────────────
    // ANALYTICS
    // ─────────────────────────────────────────────
    function AnalyticsPage({ reports }) {
      const byStatus = { approved: 0, pending: 0, rejected: 0 };
      const byCurr = { HIM: 0, GESD: 0, Combined: 0 };
      const byDist = {};
      const { ClipboardList, Users, User, GraduationCap } = lucide;
      let boys = 0, girls = 0;
      reports.forEach(r => { byStatus[r.status] = (byStatus[r.status] || 0) + 1; byCurr[r.curriculum] = (byCurr[r.curriculum] || 0) + 1; byDist[r.district] = (byDist[r.district] || 0) + 1; boys += r.boys; girls += r.girls; });
      const Bar = ({ label, value, max, color = OR }) => (
        <div style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ fontWeight: 600 }}>{label}</span><span style={{ color: OR, fontWeight: 700 }}>{value}</span></div>
          <ProgBar pct={max ? Math.round(value / max * 100) : 0} color={color} />
        </div>
      );
      return (
        <div>
          <Kicker text="Analytics" />
          <h1 style={{ margin: "0 0 13px", fontSize: 21, fontWeight: 700 }}>Program Analytics</h1>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(135px,1fr))", gap: 9, marginBottom: 16 }}>
            <StatCard icon={<ClipboardList size={20} />} label="Total Reports" value={reports.length} /> <StatCard icon={<User size={20} />} label="Boys Reached" value={boys} color="#1e40af" /> <StatCard icon={<User size={20} />} label="Girls Reached" value={girls} color="#a82563" /> <StatCard icon={<GraduationCap size={20} />} label="Total Students" value={boys + girls} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Card><SH title="Report Status" />{Object.entries(byStatus).map(([k, v]) => <Bar key={k} label={k.charAt(0).toUpperCase() + k.slice(1)} value={v} max={reports.length} color={k === "approved" ? "#15803d" : k === "rejected" ? "#dc2626" : OR} />)}</Card>
            <Card><SH title="By Curriculum" />{Object.entries(byCurr).map(([k, v]) => <Bar key={k} label={k} value={v} max={reports.length} />)}</Card>
            <Card><SH title="By District" />{Object.entries(byDist).map(([k, v]) => <Bar key={k} label={k} value={v} max={Math.max(...Object.values(byDist))} />)}</Card>
          </div>
          <Card>
            <SH title="Regional Summary" />
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <TH cols={["Region", "Districts", "TOTs", "Schools", "Clusters", "Coverage"]} />
              <tbody>
                {[["Northern", "6/6", "249", "83", "28", "70%"], ["Central", "6/9", "384", "128", "44", "61%"], ["Southern", "10/13", "501", "167", "55", "73%"]].map(([r, ...v]) => (
                  <tr key={r} style={{ borderBottom: "1px solid #f3f4f6" }}><td style={{ padding: "7px 9px", fontWeight: 700 }}>{r}</td>{v.map((x, i) => <td key={i} style={{ padding: "7px 9px", color: "#374151" }}>{x}</td>)}</tr>
                ))}
              </tbody>
            </table>
          </Card>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // USER MANAGEMENT
    // ─────────────────────────────────────────────
    function UsersPage({ user: cu, showToast }) {
      const [users, setUsers] = useState(USERS_INIT.map(u => ({ ...u })));
      const [showAdd, setShowAdd] = useState(false);
      const [filt, setFilt] = useState("all");
      const [search, setSearch] = useState("");
      const [nf, setNf] = useState({ first: "", last: "", email: "", role: "data_entry", district: "" });
      const sn = k => e => setNf(p => ({ ...p, [k]: e.target.value }));
      if (!can(cu.role, "manageUsers")) return <div style={{ padding: 48, textAlign: "center", color: "#9ca3af" }}>🔒 Access denied. National Admin only.</div>;
      const visible = users.filter(u => { if (filt !== "all" && u.role !== filt) return false; const q = search.toLowerCase(); if (q && !u.name.toLowerCase().includes(q) && !u.email.toLowerCase().includes(q)) return false; return true; });
      const addUser = () => {
        if (!nf.first || !nf.last || !nf.email) { showToast("⚠️ Fill in name and email"); return; }
        setUsers(p => [{ id: Date.now().toString(), email: nf.email, password: "temp123", role: nf.role, name: `${nf.first} ${nf.last}`, district: nf.district || null, avatar: (nf.first[0] + nf.last[0]).toUpperCase(), status: "pending" }, ...p]);
        setShowAdd(false); setNf({ first: "", last: "", email: "", role: "data_entry", district: "" });
        showToast(`✅ ${nf.first} ${nf.last} added — pending activation`);
      };
      const cols = ["#ea6c0a", "#2563a8", "#15803d", "#7c3aed", "#dc2626", "#0891b2"];
      return (
        <div>
          <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginBottom: 16 }}>
            <div><Kicker text="Admin" /><h1 style={{ margin: 0, fontSize: 21, fontWeight: 700 }}>User Management</h1></div>
            <Btn onClick={() => setShowAdd(true)}>➕ Add User</Btn>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 14 }}>
            <StatCard icon="👥" label="Total Users" value={users.length} /><StatCard icon="✅" label="Active" value={users.filter(u => u.status === "active").length} color="#15803d" /><StatCard icon="⏳" label="Pending" value={users.filter(u => u.status === "pending").length} color="#f59e0b" /><StatCard icon="📍" label="Districts" value={[...new Set(users.filter(u => u.district).map(u => u.district))].length} />
          </div>
          <Card>
            <FilterBar
              options={["all", "admin", "tot", "data_entry", "district_coordinator", "viewer"].map(x => ({ v: x, l: x === "all" ? "All" : (ROLE_CFG[x]?.label || x) + " (" + (x === "all" ? users : users.filter(u => u.role === x)).length + ")" }))}
              active={filt} onChange={setFilt} search={search} onSearch={setSearch} searchPlaceholder="Search users…"
            />
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                <TH cols={["User", "Role", "District", "Status", "Actions"]} />
                <tbody>
                  {visible.map((u, i) => {
                    const rc = ROLE_CFG[u.role];
                    return (
                      <tr key={u.id} style={{ borderBottom: "1px solid #f3f4f6" }}>
                        <td style={{ padding: "8px 9px" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <div style={{ width: 28, height: 28, borderRadius: "50%", background: cols[i % cols.length], color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, flexShrink: 0 }}>{u.avatar}</div>
                            <div><div style={{ fontWeight: 700, fontSize: 12 }}>{u.name}</div><div style={{ fontSize: 10.5, color: "#9ca3af" }}>{u.email}</div></div>
                          </div>
                        </td>
                        <td style={{ padding: "8px 9px" }}><Badge text={rc?.label || u.role} color={rc?.color || "#6b7280"} bg={rc?.bg || "#f3f4f6"} /></td>
                        <td style={{ padding: "8px 9px", fontSize: 12, color: "#6b7280" }}>{u.district || "—"}</td>
                        <td style={{ padding: "8px 9px" }}>
                          <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 12 }}>
                            <span style={{ width: 7, height: 7, borderRadius: "50%", background: u.status === "active" ? "#22c55e" : u.status === "pending" ? "#f59e0b" : "#d1d5db", display: "inline-block" }} />
                            {u.status.charAt(0).toUpperCase() + u.status.slice(1)}
                          </span>
                        </td>
                        <td style={{ padding: "8px 9px" }}>
                          <div style={{ display: "flex", gap: 4 }}>
                            {u.status === "pending" && <Btn size="sm" variant="success" onClick={() => { setUsers(p => p.map(x => x.id === u.id ? { ...x, status: "active" } : x)); showToast("User activated!"); }}>Activate</Btn>}
                            {u.status === "active" && u.id !== cu.id && <Btn size="sm" variant="danger" onClick={() => { setUsers(p => p.map(x => x.id === u.id ? { ...x, status: "inactive" } : x)); showToast("User deactivated."); }}>Deactivate</Btn>}
                            <Btn size="sm" variant="ghost" onClick={() => showToast(`Editing ${u.name}…`)}>Edit</Btn>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                  {visible.length === 0 && <tr><td colSpan={5} style={{ padding: 20, textAlign: "center", color: "#9ca3af" }}>No users found</td></tr>}
                </tbody>
              </table>
            </div>
          </Card>
          {showAdd && (
            <Modal title="Add New User" onClose={() => setShowAdd(false)}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
                <FInput label="First Name *" placeholder="Grace" value={nf.first} onChange={sn("first")} />
                <FInput label="Last Name *" placeholder="Kamwendo" value={nf.last} onChange={sn("last")} />
              </div>
              <FInput label="Email Address *" type="email" placeholder="grace@ujamaa.mw" value={nf.email} onChange={sn("email")} />
              <FSelect label="Role *" value={nf.role} onChange={sn("role")}>
                <option value="tot">Trainer of Trainers</option>
                <option value="data_entry">Data Entry Officer</option>
                <option value="district_coordinator">District Coordinator</option>
                <option value="viewer">Viewer</option>
                <option value="admin">National Admin</option>
              </FSelect>
              <FSelect label="District" value={nf.district} onChange={sn("district")}>
                <option value="">None (National)</option>
                {DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}
              </FSelect>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={addUser}>Add User</Btn>
                <Btn variant="secondary" onClick={() => setShowAdd(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </div>
      );
    }

        { id: 1, emoji: "👧", color: "#fdf2f8", border: "#f0a0cc", accent: "#a82563", title: "Breaking the Silence in Mzimba", quote: "I learned that my voice is my power.", who: "Chifundo, 14 — Student", district: "Mzimba District", date: "April 2026", curriculum: "GESD", full: "Chifundo had been silent about abuse for over a year. After completing the GESD program's Session 3 on Awareness and learning to trust her inner voice, she finally reported to a trusted teacher. The school cluster intervened swiftly through the referral pathway, connecting her to VSU support and counselling. She is now back in class, thriving, and has become a peer mentor for younger girls in her cluster." },
        { id: 2, emoji: "👦", color: "#eff6ff", border: "#93c5fd", accent: "#1e40af", title: "A Hero Emerges in Lilongwe", quote: "Being a hero means helping someone in need.", who: "John, 13 — Student", district: "Lilongwe Central Cluster", date: "March 2026", curriculum: "HIM", full: "John witnessed a younger student being harassed on the school grounds. Using the 'Step-Up Strategies' from HIM Topic 4 — the Direct, Distract, Delegate method — he calmly distracted the aggressor and walked the victim safely to a teacher. His cluster lead nominated him as a 'Hero in Me' champion for the term. John now leads weekly discussions with boys in his class." },
        { id: 3, emoji: "👩‍🏫", color: "#f0fdf4", border: "#86efac", accent: "#15803d", title: "Teacher Training Transforms a School", quote: "Our school now has a referral pathway that actually works.", who: "Mr. Mkandawire — Head Teacher, Kawale Primary", district: "Lilongwe District", date: "February 2026", curriculum: "ETT", full: "After 12 teachers completed the 6-day ETT program, Kawale Primary formed a Child Protection Committee and established a formal referral pathway with local police, VSU, and social welfare. Within three months, reporting of SGBV incidents increased by 70% — not because more incidents occurred, but because students and teachers finally trusted the system enough to speak up. The school has since been adopted as a model cluster for the region." },
        { id: 4, emoji: "🌟", color: "#fff7ed", border: "#fdba74", accent: "#c25808", title: "Girls Lead the Way in Blantyre", quote: "We are not victims — we are leaders.", who: "Grace, 15 — GESD Graduate & Peer Mentor", district: "Blantyre South Cluster", date: "January 2026", curriculum: "GESD", full: "After completing all six GESD sessions, Grace started a weekly girls' safety club at her school with support from her TOT. Within two months, 35 girls were meeting regularly to discuss personal boundaries, self-defence techniques from Session 5, and how to safely report concerns. Three girls in the group have since accessed referral support through the school's cluster lead." },
        { id: 5, emoji: "🤝", color: "#f5f3ff", border: "#c4b5fd", accent: "#7c3aed", title: "Boys & Girls Build a Safety Charter Together", quote: "We signed it together — it belongs to all of us.", who: "Combined Class — Karonga Primary", district: "Karonga Lakeshore Cluster", date: "March 2026", curriculum: "Combined", full: "The combined Session 6 brought boys from the HIM program and girls from GESD together for the first time. After sharing what they had learned, students co-wrote a School Safety Charter committing to respect, non-violence, and mutual support. The charter is now displayed at the school entrance. Teachers report a measurable shift in how boys and girls interact on the playground and in class." },
        { id: 6, emoji: "📣", color: "#fef2f2", border: "#fca5a5", accent: "#991b1b", title: "Community Father Changes His Stance", quote: "I used to think this was not men's business. Now I know it is.", who: "Samuel Phiri — Community Father & Parent", district: "Dedza Highland Cluster", date: "February 2026", curriculum: "Community Engagement", full: "When the ETT cluster in Dedza held a community parent session, Samuel attended reluctantly. By the end, he had signed up to be a community champion. He now attends cluster meetings and speaks openly with other fathers about supporting their daughters' education and safety. His daughter is enrolled in GESD and says her father 'finally understands what we go through.'" },

            <div style={{ position: "absolute", top: -40, right: -40, width: 200, height: 200, borderRadius: "50%", background: "rgba(234,108,10,.15)" }} />

                    <div style={{ fontSize: 20, fontWeight: 800, color: OR }}>{v}</div>

            <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
              {PRESS.map((p, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", background: "#fafaf9", borderRadius: 9, border: "1px solid #f0d7c1" }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: OR_PALE, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>📰</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 12.5, color: "#111", marginBottom: 2 }}>{p.headline}</div>
                    <div style={{ fontSize: 11, color: "#9ca3af" }}>{p.outlet} · {p.date}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {/* CTA STRIP */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 10, marginBottom: 14 }}>
            {[
              { icon: "📘", title: "Explore the Curriculum", desc: "See HIM and GESD sessions in full." },
              { icon: "🗺️", title: "See Our Coverage", desc: "Explore all 22 active districts on the live map." },
              { icon: "🛡️", title: "Report a Concern", desc: "Safe, confidential case reporting for SGBV." },
            ].map(item => (
              <div key={item.title} style={{ background: "#fff", border: "1px solid #f0d7c1", borderRadius: 14, padding: "18px 16px", textAlign: "center" }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>{item.icon}</div>
                <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 5, color: "#111" }}>{item.title}</div>
                <div style={{ fontSize: 11.5, color: "#6b7280", lineHeight: 1.5 }}>{item.desc}</div>
              </div>
            ))}
          </div>

          {/* ADMIN REPORT STATS — only for logged-in users */}
          {user && (
            <Card style={{ marginBottom: 14 }}>
              <SH title="Session Report Summary" action={<Btn size="sm" variant="secondary" onClick={() => showToast("Export coming soon")}>Export →</Btn>} />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(130px,1fr))", gap: 9 }}>
                {[["📋", "Total Reports", reports.length], ["✅", "Approved", reports.filter(r => r.status === "approved").length], ["⏳", "Pending", reports.filter(r => r.status === "pending").length], ["👦", "Boys", reports.reduce((a, r) => a + r.boys, 0)], ["👧", "Girls", reports.reduce((a, r) => a + r.girls, 0)]].map(([i, l, v]) => (
                  <StatCard key={l} icon={i} label={l} value={v} />
                ))}
              </div>
            </Card>
          )}

          {/* SHARE STORY MODAL */}
          {showForm && (
            <Modal title="Share Your Story" onClose={() => { setShowForm(false); setSubmitted(false); setStoryForm({ name: "", district: "", role: "", story: "" }); }}>
              {submitted ? (
                <div style={{ textAlign: "center", padding: "24px 0" }}>
                  <div style={{ fontSize: 48, marginBottom: 12 }}>🙏</div>
                  <h3 style={{ margin: "0 0 8px", fontWeight: 700 }}>Thank You!</h3>
                  <p style={{ color: "#6b7280", fontSize: 13, lineHeight: 1.6 }}>Your story has been received. Our team will review it and may reach out before publishing. Your privacy is fully protected.</p>
                  <Btn style={{ marginTop: 12 }} onClick={() => { setShowForm(false); setSubmitted(false); setStoryForm({ name: "", district: "", role: "", story: "" }); }}>Close</Btn>
                </div>
              ) : (
                <>
                  <p style={{ margin: "0 0 14px", color: "#6b7280", fontSize: 12.5, lineHeight: 1.6 }}>Share how the ETT program has made a difference for you, your school, or your community. You can use a first name only or remain anonymous.</p>
                  <FInput label="Your Name (or 'Anonymous')" placeholder="e.g. Grace or Anonymous" value={storyForm.name} onChange={e => setStoryForm(p => ({ ...p, name: e.target.value }))} />
                  <FSelect label="District" value={storyForm.district} onChange={e => setStoryForm(p => ({ ...p, district: e.target.value }))}>
                    <option value="">Select district (optional)</option>
                    {DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}
                  </FSelect>
                  <FSelect label="I am a..." value={storyForm.role} onChange={e => setStoryForm(p => ({ ...p, role: e.target.value }))}>
                    <option value="">Prefer not to say</option>
                    <option>Student</option>
                    <option>Teacher / TOT</option>
                    <option>Parent / Guardian</option>
                    <option>Community member</option>
                    <option>School head</option>
                  </FSelect>
                  <FArea label="Your Story *" placeholder="Tell us what changed for you, your school, or your community." value={storyForm.story} onChange={e => setStoryForm(p => ({ ...p, story: e.target.value }))} />
                  <div style={{ background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 8, padding: "9px 12px", fontSize: 11.5, color: "#15803d", marginBottom: 12 }}>
                    🔒 Your submission is private and secure. We will never publish your story without your permission.
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn onClick={submitStory}>Submit Story</Btn>
                    <Btn variant="secondary" onClick={() => setShowForm(false)}>Cancel</Btn>
                  </div>
                </>
              )}
            </Modal>
          )}

        </div>
      );
    }
    // ─────────────────────────────────────────────
    // ABOUT PAGE
    // ─────────────────────────────────────────────
    function AboutPage() {
      return (
        <div>
          <div style={{ background: "#fff", border: `1px solid ${OR_PALE}`, borderRadius: 12, padding: "28px 26px", color: "#111827", marginBottom: 14, boxShadow: "0 8px 24px rgba(234,108,10,.08)" }}>
            <h2 style={{ margin: "0 0 5px", fontSize: 20, fontWeight: 700 }}>Fighting SGBV Through Education</h2>
            <p style={{ margin: 0, color: "#6b7280", fontSize: 13, lineHeight: 1.6, maxWidth: 460 }}>Ujamaa Pamodzi Africa works across Malawi to end SGBV through community-led education, teacher empowerment, and collaborative school networks.</p>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 9 }}>
            {[["📍", "Our Mission", "Eliminate SGBV in Malawi by empowering teachers and students with knowledge and community support."], ["🌍", "Our Reach", "19 active districts, 127 clusters, 7,620+ students across all three regions."], ["👩‍🏫", "Our Approach", "Peer-led ETT training empowering teachers to become agents of change."], ["⚖️", "Legal Framework", "Aligned with Malawi's Gender Equality Act and Child Care, Protection and Justice Act."], ["🤝", "Partnerships", "Ministry of Education, district offices, teacher training colleges and community leaders."], ["📞", "Contact Us", "Lilongwe, Malawi · info@ujamaa.mw\nChild Helpline: 116 · VSU: 997"]].map(([i, t, d]) => (
              <Card key={t}>
                <div style={{ fontSize: 20, marginBottom: 7 }}>{i}</div>
                <h4 style={{ margin: "0 0 4px", fontSize: 12.5, fontWeight: 700 }}>{t}</h4>
                <p style={{ margin: 0, fontSize: 11.5, color: "#6b7280", lineHeight: 1.6, whiteSpace: "pre-line" }}>{d}</p>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // ROOT APP
    // ─────────────────────────────────────────────
    function App() {
      const [user, setUser] = useState(null);
      const [page, setPage] = useState("dashboard");
      const [reports, setReports] = useState(REPORTS_INIT);
      const [toast, setToast] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [mapFocus, setMapFocus] = useState(null);

      const showToast = useCallback(msg => {
        setToast(msg); setTimeout(() => setToast(null), 3800);
      }, []);

      const addReport = r => setReports(p => [{ id: Date.now(), ...r }, ...p]);
      const updateStatus = (id, status) => setReports(p => p.map(r => r.id === id ? { ...r, status } : r));
      const openMapTarget = target => { setMapFocus(target); setPage("maps"); };
      // Auto-close sidebar when leaving dashboard
      useEffect(() => {
        if (page !== "dashboard") setSidebarOpen(false);
      }, [page]);
      const renderPage = () => {
        const publicPages = ["dashboard", "submit", "maps", "trainings", "about", "login", "impact", "curriculum"];
        if (page === "login")
          return (
            <LoginPage
              onLogin={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onRegister={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onPublicView={() => {
                setUser(null);
                setPage("dashboard");
              }}
            />
          );

        if (!user && !publicPages.includes(page))
          return (
            <LoginPage
              onLogin={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onRegister={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onPublicView={() => {
                setUser(null);
                setPage("dashboard");
              }}
            />
          );
        if (page === "login")
          return (
            <LoginPage
              onLogin={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onRegister={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onPublicView={() => {
                setUser(null);
                setPage("dashboard");
              }}
            />
          );

        if (!user && !publicPages.includes(page))
          return (
            <LoginPage
              onLogin={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onRegister={u => {
                setUser(u);
                setPage("dashboard");
              }}
              onPublicView={() => {
                setUser(null);
                setPage("dashboard");
              }}
            />
          ); if (
          !user &&
          (
            page === "users" ||
            page === "reports" ||
            page === "analytics" ||
            page === "my_reports"
          )
        ) {
          return (
            <Card style={{ maxWidth: 500 }}>
              <h2>🔒 Restricted Page</h2>

              <p style={{ color: "#6b7280" }}>
                This page is only available to authorized ETT staff members.
              </p>

              <Btn onClick={() => setPage("login")}>
                Staff Login
              </Btn>
            </Card>
          );
        }
        switch (page) {
          case "dashboard": return <Dashboard user={user} reports={reports} setPage={setPage} />;
          case "submit": return <SubmitReport user={user} onSubmit={addReport} showToast={showToast} />;
          case "reports":
          case "my_reports": return <ReportsPage user={user} reports={reports} onUpdateStatus={updateStatus} showToast={showToast} />;
          case "maps": return (<MapsPage setPage={setPage} user={user} focus={mapFocus} />);
          case "clusters": return <ClustersPage user={user} setPage={setPage} onOpenMap={openMapTarget} />;
          case "districts": return <DistrictsPage user={user} onOpenMap={openMapTarget} />;
          case "trainings": return <TrainingsPage />;
          case "curriculum": return <CurriculumPage />;
          case "ett": return <ETTPage />;
          case "analytics": return <AnalyticsPage reports={reports} />;
          case "users": return <UsersPage user={user} showToast={showToast} />;
          case "impact": return <ImpactPage reports={reports} showToast={showToast} user={user} />;
          case "about": return <AboutPage />;
          default: return <Dashboard user={user} reports={reports} setPage={setPage} />;
        }
      };

      return (
        <>
          <GlobalStyles />
          <div
            style={{
              minHeight: "100vh",
              background: "#f5f7fb",
              display: "flex"
            }}
          >

            <Sidebar
              page={page}
              setPage={setPage}
              user={user}
              onLogout={() => {
                setUser(null);
                setPage("dashboard");
              }}
              open={sidebarOpen}
              onClose={() => setSidebarOpen(false)}
            />

            <div
              style={{
                flex: 1,
                display: "flex",
                flexDirection: "column",
                overflow: "hidden"
              }}
            >

              {/* TOPBAR */}
              <div
                data-topbar
                style={{
                  background: "rgba(255,255,255,.96)",
                  borderBottom: "1px solid #f3e4d7",
                  padding: "0 18px",
                  height: 52,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                  flexShrink: 0,
                  zIndex: 100,
                  boxShadow: "0 2px 12px rgba(59,38,33,.06)"
                }}
              >
                {/* LEFT: hamburger / back + brand */}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                  {/* On dashboard: show hamburger. On other pages: show back button */}
                  {page === "dashboard" ? (
                    <button
                      onClick={() => setSidebarOpen(!sidebarOpen)}
                      style={{
                        border: "none",
                        background: sidebarOpen ? OR_PALE : "transparent",
                        cursor: "pointer",
                        padding: "7px 8px",
                        borderRadius: 8,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        transition: "all .13s",
                        flexShrink: 0
                      }}
                    >
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={sidebarOpen ? OR_D : "#374151"} strokeWidth="2.2">
                        {sidebarOpen ? (
                          <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>
                        ) : (
                          <><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></>
                        )}
                      </svg>
                    </button>
                  ) : (
                    <button
                      onClick={() => setPage("dashboard")}
                      style={{
                        border: "1px solid #e5e7eb",
                        background: "#fff",
                        cursor: "pointer",
                        padding: "6px 12px",
                        borderRadius: 8,
                        display: "flex",
                        alignItems: "center",
                        gap: 5,
                        fontSize: 13,
                        fontWeight: 700,
                        color: "#374151",
                        transition: "all .13s",
                        flexShrink: 0
                      }}
                      onMouseEnter={e => { e.currentTarget.style.background = OR_PALE; e.currentTarget.style.borderColor = OR; e.currentTarget.style.color = OR_D; }}
                      onMouseLeave={e => { e.currentTarget.style.background = "#fff"; e.currentTarget.style.borderColor = "#e5e7eb"; e.currentTarget.style.color = "#374151"; }}
                    >
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <polyline points="15 18 9 12 15 6" />
                      </svg>
                      Back
                    </button>
                  )}

                  {/* Brand + page label */}
                  <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <AfricaLogo size={26} />
                    <div style={{ fontSize: 14, color: "#9ca3af", fontWeight: 600 }}>
                      ETT Malawi
                      {page !== "dashboard" && (
                        <>
                          <span style={{ margin: "0 6px", opacity: .35 }}>›</span>
                          <b style={{ color: "#111", fontSize: 14 }}>{PAGE_LABELS[page] || page}</b>
                        </>
                      )}
                    </div>
                  </div>

                </div>

                {/* RIGHT: Sign In or user pill */}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  {user ? (
                    <div
                      style={{
                        background: OR_PALE,
                        color: OR_D,
                        padding: "4px 11px",
                        borderRadius: 20,
                        fontSize: 11.5,
                        fontWeight: 700,
                        cursor: "pointer",
                        display: "flex",
                        alignItems: "center",
                        gap: 6
                      }}
                      onClick={() => setPage("dashboard")}
                    >
                      {ROLE_CFG[user.role].icon} {user.name}
                    </div>
                  ) : (
                    <Btn size="sm" onClick={() => setPage("login")}>Sign In</Btn>
                  )}
                </div>

              </div>
              {/* END TOPBAR */}

              {/* CONTENT */}
              <div
                data-content
                style={{
                  flex: 1,
                  overflowY: "auto",
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  padding: "24px 20px"
                }}
              >

                {/* PAGE CONTENT */}
                <div style={{ width: "100%", maxWidth: 1400, flex: 1 }}>
                  {renderPage()}
                </div>

                {/* FOOTER */}
                <div
                  style={{
                    width: "100%",
                    maxWidth: 1400,
                    marginTop: 40,
                    paddingTop: 20,
                    paddingBottom: 20,
                    borderTop: "1px solid #f0d7c1",
                    textAlign: "center",
                    flexShrink: 0
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}>
                    <AfricaLogo size={20} variant="orange" />
                    <span style={{ fontSize: 12.5, fontWeight: 800, color: BLACK }}>ETT Malawi</span>
                  </div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", marginBottom: 3 }}>
                    Empowering the Boys and Girls to fight SGBV
                  </div>
                  <div style={{ fontSize: 11.5, color: "#6b7280", marginBottom: 4 }}>
                    Child Protection and Empowerment Program
                  </div>
                  <div style={{ fontSize: 10.5, color: "#9ca3af", marginBottom: 10 }}>
                    © 2026 Ujamaa Pamodzi Africa. All rights reserved.
                  </div>
                  <div style={{ display: "flex", justifyContent: "center", gap: 14, flexWrap: "wrap" }}>
                    {[["🆘", "Child Helpline", "116"], ["👮", "VSU Police", "997"], ["📧", "Email", "info@ujamaa.mw"]].map(([icon, label, val]) => (
                      <span key={label} style={{ fontSize: 10.5, color: "#9ca3af", display: "flex", alignItems: "center", gap: 4 }}>
                        {icon} <b style={{ color: "#6b7280" }}>{label}:</b> {val}
                      </span>
                    ))}
                  </div>
                </div>
                {/* END FOOTER */}

              </div>
              {/* END CONTENT */}

            </div>

          </div>

          {toast && (
            <Toast
              msg={toast}
              onClose={() => setToast(null)}
            />
          )}

        </>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
