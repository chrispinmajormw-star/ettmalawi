              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={addUser}>Add User</Btn>
                <Btn variant="secondary" onClick={() => setShowAdd(false)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ─── IMPACT PAGE ─────────────────────────────
    function ImpactPage({ reports, showToast, user }) {
      const [expanded, setExpanded] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [storyForm, setStoryForm] = useState({ name: "", district: "", role: "", story: "" });
      const [submitted, setSubmitted] = useState(false);

      const STORIES = [
        { id: 1, emoji: "👧", color: "#fdf2f8", border: "#f0a0cc", accent: "#a82563", title: "Breaking the Silence in Mzimba", quote: "I learned that my voice is my power.", who: "Chifundo, 14 — Student", district: "Mzimba District", date: "April 2026", curriculum: "GESD", full: "Chifundo had been silent about abuse for over a year. After completing the GESD program's Session 3 on Awareness and learning to trust her inner voice, she finally reported to a trusted teacher. The school cluster intervened swiftly through the referral pathway, connecting her to VSU support and counselling. She is now back in class, thriving, and has become a peer mentor for younger girls in her cluster." },
        { id: 2, emoji: "👦", color: "#eff6ff", border: "#93c5fd", accent: "#1e40af", title: "A Hero Emerges in Lilongwe", quote: "Being a hero means helping someone in need.", who: "John, 13 — Student", district: "Lilongwe Central Cluster", date: "March 2026", curriculum: "HIM", full: "John witnessed a younger student being harassed on the school grounds. Using the 'Step-Up Strategies' from HIM Topic 4 — the Direct, Distract, Delegate method — he calmly distracted the aggressor and walked the victim safely to a teacher." },
        { id: 3, emoji: "👩‍🏫", color: "#f0fdf4", border: "#86efac", accent: "#15803d", title: "Teacher Training Transforms a School", quote: "Our school now has a referral pathway that actually works.", who: "Mr. Mkandawire — Head Teacher, Kawale Primary", district: "Lilongwe District", date: "February 2026", curriculum: "ETT", full: "After 12 teachers completed the 6-day ETT program, Kawale Primary formed a Child Protection Committee. Within three months, reporting of SGBV incidents increased by 70% — because students and teachers finally trusted the system enough to speak up." },
        { id: 4, emoji: "🌟", color: "#fff7ed", border: "#fdba74", accent: "#c44d00", title: "Girls Lead the Way in Blantyre", quote: "We are not victims — we are leaders.", who: "Grace, 15 — GESD Graduate & Peer Mentor", district: "Blantyre South Cluster", date: "January 2026", curriculum: "GESD", full: "After completing all six GESD sessions, Grace started a weekly girls' safety club at her school. Within two months, 35 girls were meeting regularly. Three girls in the group have since accessed referral support through the school's cluster lead." },
        { id: 5, emoji: "🤝", color: "#f5f3ff", border: "#c4b5fd", accent: "#7c3aed", title: "Boys & Girls Build a Safety Charter Together", quote: "We signed it together — it belongs to all of us.", who: "Combined Class — Karonga Primary", district: "Karonga Lakeshore Cluster", date: "March 2026", curriculum: "Combined", full: "The combined Session 6 brought boys from the HIM program and girls from GESD together for the first time. Students co-wrote a School Safety Charter committing to respect, non-violence, and mutual support. The charter is now displayed at the school entrance." },
        { id: 6, emoji: "📣", color: "#fef2f2", border: "#fca5a5", accent: "#991b1b", title: "Community Father Changes His Stance", quote: "I used to think this was not men's business. Now I know it is.", who: "Samuel Phiri — Community Father & Parent", district: "Dedza Highland Cluster", date: "February 2026", curriculum: "Community Engagement", full: "When the ETT cluster in Dedza held a community parent session, Samuel attended reluctantly. By the end, he had signed up to be a community champion. He now attends cluster meetings and speaks openly with other fathers about supporting their daughters' education and safety." },
      ];

      const MILESTONES = [
        { year: "2023", event: "ETT Country wide ScaleUp introduction" },
        { year: "2024", event: "Scaled Up in 4 more districts" },
        { year: "2025", event: "585,000 Learners trained in 12 districts" },
        { year: "2026", event: "MOU Signed with Ministry of Education" },
      ];
      const PRESS = [
        { outlet: "Nation Online Malawi", headline: "ScaleUp ETT Program recognised as model SGBV intervention", date: "Mar 2026" },
        { outlet: "UNICEF Malawi", headline: "Community-led safety training making strides in schools", date: "Jan 2026" },
        { outlet: "Ministry of Education", headline: "ETT clusters adopted in national school safety framework", date: "Nov 2025" },
      ];

      const submitStory = () => {
        if (!storyForm.name || !storyForm.story) { showToast("Please fill in your name and story"); return; }
        setSubmitted(true);
        showToast("✅ Thank you — your story has been received safely.");
      };

      return (
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ background: `linear-gradient(135deg,${BLACK} 0%,#1a2535 100%)`, borderRadius: 20, padding: "36px 32px", color: "#fff", marginBottom: 24, position: "relative", overflow: "hidden" }}>
            <div style={{ position: "absolute", top: -40, right: -40, width: 200, height: 200, borderRadius: "50%", background: "rgba(234,108,10,.15)" }} />
            <div style={{ position: "relative" }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.4, textTransform: "uppercase", color: OR, marginBottom: 8 }}>Real Stories · Real Change</div>
              <h1 style={{ margin: "0 0 10px", fontSize: "clamp(1.6rem,4vw,2.4rem)", fontWeight: 800, lineHeight: 1.1 }}>Impact Stories</h1>
              <p style={{ margin: "0 0 22px", fontSize: 13.5, opacity: .75, maxWidth: 500, lineHeight: 1.6 }}>Every number in our data represents a real young person. These are their stories.</p>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {[["592,200+", "Learners Reached"], ["665+", "TOTs Trained"], ["396", "School Clusters"], ["15", "Active Districts"]].map(([v, l]) => (
                  <div key={l} style={{ background: "rgba(255,255,255,.1)", border: "1px solid rgba(255,255,255,.15)", borderRadius: 10, padding: "10px 16px", textAlign: "center", minWidth: 90 }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color: OR }}>{v}</div>
                    <div style={{ fontSize: 9.5, opacity: .6, marginTop: 2, textTransform: "uppercase", letterSpacing: .8 }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 1.3, textTransform: "uppercase", color: OR, marginBottom: 3 }}>Voices from the Field</div>
              <h2 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#111" }}>Stories of Change</h2>
            </div>
            <button onClick={() => setShowForm(true)} style={{ background: OR, color: "#fff", border: "none", borderRadius: 9, padding: "9px 16px", fontSize: 12, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>📢 Share Your Story</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(290px,1fr))", gap: 14, marginBottom: 24 }}>
            {STORIES.map(s => (
              <div key={s.id} style={{ background: s.color, border: `1px solid ${s.border}`, borderRadius: 16, overflow: "hidden", transition: "transform .15s,box-shadow .15s" }} onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = "0 12px 28px rgba(0,0,0,.1)"; }} onMouseLeave={e => { e.currentTarget.style.transform = ""; e.currentTarget.style.boxShadow = ""; }}>
                <div style={{ padding: "18px 16px 14px" }}>
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>
                    <div style={{ width: 44, height: 44, borderRadius: 12, background: "rgba(255,255,255,.7)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>{s.emoji}</div>
                    <span style={{ padding: "3px 9px", borderRadius: 20, fontSize: 9.5, fontWeight: 700, background: "rgba(255,255,255,.7)", color: s.accent }}>{s.curriculum}</span>
                  </div>
                  <h3 style={{ margin: "0 0 8px", fontSize: 13.5, fontWeight: 700, color: "#111", lineHeight: 1.3 }}>{s.title}</h3>
                  <div style={{ borderLeft: `3px solid ${s.accent}`, paddingLeft: 10, marginBottom: 10 }}>
                    <p style={{ margin: 0, fontStyle: "italic", fontSize: 12.5, color: "#374151", lineHeight: 1.5 }}>"{s.quote}"</p>
                  </div>
                  <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 10 }}>— {s.who}</div>
                  {expanded === s.id ? (
                    <div>
                      <p style={{ margin: "0 0 10px", fontSize: 12, color: "#374151", lineHeight: 1.7 }}>{s.full}</p>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 10, color: "#9ca3af" }}>📍 {s.district} · 📅 {s.date}</span>
                        <button onClick={() => setExpanded(null)} style={{ background: "none", border: `1px solid ${s.border}`, borderRadius: 6, padding: "3px 9px", fontSize: 10.5, fontWeight: 700, color: s.accent, cursor: "pointer" }}>Close ▲</button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 10, color: "#9ca3af" }}>📅 {s.date}</span>
                      <button onClick={() => setExpanded(s.id)} style={{ background: s.accent, border: "none", borderRadius: 6, padding: "4px 11px", fontSize: 10.5, fontWeight: 700, color: "#fff", cursor: "pointer" }}>Read story ▼</button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>

          <Card style={{ marginBottom: 14 }}>
            <SH title="Program Milestones" />
            <div style={{ position: "relative", paddingLeft: 24 }}>
              <div style={{ position: "absolute", left: 8, top: 0, bottom: 0, width: 2, background: "#f0d7c1", borderRadius: 2 }} />
              {MILESTONES.map((m, i) => (
                <div key={i} style={{ position: "relative", marginBottom: 14, display: "flex", gap: 14, alignItems: "flex-start" }}>
                  <div style={{ position: "absolute", left: -20, top: 3, width: 12, height: 12, borderRadius: "50%", background: i === MILESTONES.length - 1 ? OR : "#fff", border: `2px solid ${OR}`, flexShrink: 0 }} />
                  <div style={{ background: i === MILESTONES.length - 1 ? OR_PALE : "#fafaf9", border: `1px solid ${i === MILESTONES.length - 1 ? OR_PALE : "#e5e7eb"}`, borderRadius: 8, padding: "8px 12px", flex: 1 }}>
                    <span style={{ fontSize: 10, fontWeight: 800, color: OR, marginRight: 8 }}>{m.year}</span>
                    <span style={{ fontSize: 12, color: "#374151" }}>{m.event}</span>
                    {i === MILESTONES.length - 1 && <span style={{ marginLeft: 8, fontSize: 9.5, fontWeight: 700, background: OR, color: "#fff", padding: "1px 6px", borderRadius: 10 }}>Current</span>}
                  </div>
                </div>
              ))}
            </div>
          </Card>

          <Card style={{ marginBottom: 14 }}>
            <SH title="Recognition & Media" />
            <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
              {PRESS.map((p, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 12px", background: "#fafaf9", borderRadius: 9, border: "1px solid #f0d7c1" }}>
                  <div style={{ width: 36, height: 36, borderRadius: 8, background: OR_PALE, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>📰</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 12.5, color: "#111", marginBottom: 2 }}>{p.headline}</div>
                    <div style={{ fontSize: 11, color: "#9ca3af" }}>{p.outlet} · {p.date}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>

          {user && (
            <Card style={{ marginBottom: 14 }}>
              <SH title="Session Report Summary" action={<Btn size="sm" variant="secondary" onClick={() => showToast("Export coming soon")}>Export →</Btn>} />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(130px,1fr))", gap: 9 }}>
                {[["📋", "Total Reports", reports.length], ["✅", "Approved", reports.filter(r => r.status === "approved").length], ["⏳", "Pending", reports.filter(r => r.status === "pending").length], ["👦", "Boys", reports.reduce((a, r) => a + r.boys, 0)], ["👧", "Girls", reports.reduce((a, r) => a + r.girls, 0)]].map(([i, l, v]) => (
                  <StatCard key={l} icon={i} label={l} value={v} />
                ))}
              </div>
            </Card>
          )}

          {showForm && (
            <Modal title="Share Your Story" onClose={() => { setShowForm(false); setSubmitted(false); setStoryForm({ name: "", district: "", role: "", story: "" }); }}>
              {submitted ? (
                <div style={{ textAlign: "center", padding: "24px 0" }}>
                  <div style={{ fontSize: 48, marginBottom: 12 }}>🙏</div>
                  <h3 style={{ margin: "0 0 8px", fontWeight: 700 }}>Thank You!</h3>
                  <p style={{ color: "#6b7280", fontSize: 13, lineHeight: 1.6 }}>Your story has been received. Our team will review it and may reach out before publishing. Your privacy is fully protected.</p>
                  <Btn style={{ marginTop: 12 }} onClick={() => { setShowForm(false); setSubmitted(false); setStoryForm({ name: "", district: "", role: "", story: "" }); }}>Close</Btn>
                </div>
              ) : (
                <>
                  <p style={{ margin: "0 0 14px", color: "#6b7280", fontSize: 12.5, lineHeight: 1.6 }}>Share how the ETT program has made a difference. You can use a first name only or remain anonymous.</p>
                  <FInput label="Your Name (or 'Anonymous')" placeholder="e.g. Grace or Anonymous" value={storyForm.name} onChange={e => setStoryForm(p => ({ ...p, name: e.target.value }))} />
                  <FSelect label="District" value={storyForm.district} onChange={e => setStoryForm(p => ({ ...p, district: e.target.value }))}><option value="">Select district (optional)</option>{DISTRICT_LIST.map(d => <option key={d}>{d}</option>)}</FSelect>
                  <FSelect label="I am a..." value={storyForm.role} onChange={e => setStoryForm(p => ({ ...p, role: e.target.value }))}><option value="">Prefer not to say</option><option>Student</option><option>Teacher / TOT</option><option>Parent / Guardian</option><option>Community member</option><option>School head</option></FSelect>
                  <FArea label="Your Story *" placeholder="Tell us what changed for you, your school, or your community." value={storyForm.story} onChange={e => setStoryForm(p => ({ ...p, story: e.target.value }))} />
                  <div style={{ background: "#f0fdf4", border: "1px solid #86efac", borderRadius: 8, padding: "9px 12px", fontSize: 11.5, color: "#15803d", marginBottom: 12 }}>🔒 Your submission is private and secure. We will never publish your story without your permission.</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn onClick={submitStory}>Submit Story</Btn>
                    <Btn variant="secondary" onClick={() => setShowForm(false)}>Cancel</Btn>
                  </div>
                </>
              )}
            </Modal>
          )}
        </div>
      );
    }

    // ─── REPORT ROUTING LOGIC (Change 3) ─────────
    // TOT → District Coordinator
    // Viewer/User → District Coordinator
    // District Coordinator → Admin (forwarding)
    // Data Officer → can edit dashboard data
    // Admin → final receiver
    const REPORT_WORKFLOW = {
      tot: { sendTo: "district_coordinator", label: "District Coordinator" },
      viewer: { sendTo: "district_coordinator", label: "District Coordinator" },
      data_entry: { sendTo: "district_coordinator", label: "District Coordinator", canEdit: true },
      district_coordinator: { sendTo: "admin", label: "National Admin" },
      admin: { sendTo: null, label: "Final Recipient" },
    };

    function getReportRecipient(role) {
      return REPORT_WORKFLOW[role] || { sendTo: "admin", label: "National Admin" };
    }

    // ─── DATA OFFICER EDIT MODAL (Change 4) ───────
    function DataEditModal({ report, onSave, onClose }) {
      const [f, setF] = useState({ ...report });
      const s = k => e => setF(p => ({ ...p, [k]: e.target.value }));
      const save = () => { onSave({ ...f, boys: parseInt(f.boys)||0, girls: parseInt(f.girls)||0 }); onClose(); };
      return (
        <Modal title={`Edit Report: ${report.school}`} onClose={onClose} width={520}>
          <div style={{ background: OR_PALE, borderRadius: 8, padding: "8px 12px", marginBottom: 14, fontSize: 12, color: OR_D, fontWeight: 600 }}>
            📝 Data Officer: You can edit session details, student numbers, and status notes.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <FInput label="School Name" value={f.school} onChange={s("school")} />
            <FInput label="District" value={f.district} onChange={s("district")} />
          </div>
          <FInput label="Education Zone" value={f.zone} onChange={s("zone")} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
            <FInput label="Boys" type="number" value={f.boys} onChange={s("boys")} />
            <FInput label="Girls" type="number" value={f.girls} onChange={s("girls")} />
          </div>
          <FSelect label="Curriculum" value={f.curriculum} onChange={s("curriculum")}>
            <option value="HIM">HIM — Hero in Me (Boys)</option>
            <option value="GESD">GESD — Girls Empowerment</option>
            <option value="Combined">Combined Session</option>
          </FSelect>
          <FInput label="Session" value={f.session} onChange={s("session")} />
          <FArea label="Challenges" value={f.challenges} onChange={s("challenges")} />
          <FArea label="Success Stories" value={f.success} onChange={s("success")} />
          <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
            <Btn onClick={save}>💾 Save Changes</Btn>
            <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
          </div>
        </Modal>
      );
    }

    // ─── ROOT APP ────────────────────────────────
    function App() {
      const [user, setUser] = useState(null);
      const [page, setPage] = useState("dashboard");
      const [reports, setReports] = useState(REPORTS_INIT);
      const [toast, setToast] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [mapFocus, setMapFocus] = useState(null);
      const [notifOpen, setNotifOpen] = useState(false);
      const [editingReport, setEditingReport] = useState(null);   // Change 4: data officer editing
      const [forwardModal, setForwardModal] = useState(null);     // Change 3: forward confirmation

      const isLoginPage = page === "login" || (!user && !["dashboard","submit","maps","trainings","impact","curriculum"].includes(page));

      const showToast = useCallback(msg => { setToast(msg); setTimeout(() => setToast(null), 3800); }, []);

      const addReport = r => {
        const workflow = getReportRecipient(user?.role || "viewer");
        const newReport = {
          id: Date.now(), ...r,
          sentTo: workflow.sendTo,
          sentToLabel: workflow.label,
          workflow_status: "sent",
          submitted_role: user?.role || "public",
        };
        setReports(p => [newReport, ...p]);
        if (user && can(user.role, "approveReport")) {
          showToast("📋 New report received — awaiting your review");
        } else if (workflow.sendTo) {
          showToast(`✅ Report sent to ${workflow.label}`);
        }
      };

      const updateStatus = (id, status) => setReports(p => p.map(r => r.id === id ? { ...r, status } : r));

      // Change 3: District Coordinator forwards report to Admin
      const forwardReport = (id) => {
        setReports(p => p.map(r => r.id === id ? { ...r, status: "forwarded", sentTo: "admin", sentToLabel: "National Admin", workflow_status: "forwarded" } : r));
        showToast("📨 Report forwarded to National Admin");
        setForwardModal(null);
      };

      // Change 4: Data Officer updates report data
      const saveEditedReport = (updated) => {
        setReports(p => p.map(r => r.id === updated.id ? { ...r, ...updated } : r));
        showToast("✅ Report data updated");
      };
      const openMapTarget = target => { setMapFocus(target); setPage("maps"); };

      const pendingCount = user && can(user.role, "approveReport")
        ? reports.filter(r => r.status === "pending" && (user.role === "district_coordinator" ? r.district === user.district : true)).length
        : 0;

      useEffect(() => { if (page !== "dashboard") setSidebarOpen(false); }, [page]);
      useEffect(() => {
        if (!notifOpen) return;
        const close = e => { if (!e.target.closest("[data-notif-root]")) setNotifOpen(false); };
        document.addEventListener("mousedown", close);
        return () => document.removeEventListener("mousedown", close);
      }, [notifOpen]);

      const renderPage = () => {
        const publicPages = ["dashboard", "submit", "maps", "trainings", "about", "login", "impact", "curriculum"];
        if (page === "login") return <LoginPage onLogin={u => { setUser(u); setPage("dashboard"); }} onRegister={u => { setUser(u); setPage("dashboard"); }} onPublicView={() => { setUser(null); setPage("dashboard"); }} />;
        if (!user && !publicPages.includes(page)) return <LoginPage onLogin={u => { setUser(u); setPage("dashboard"); }} onRegister={u => { setUser(u); setPage("dashboard"); }} onPublicView={() => { setUser(null); setPage("dashboard"); }} />;
        if (!user && (page === "users" || page === "reports" || page === "analytics" || page === "my_reports")) return <Card style={{ maxWidth: 500 }}><h2>🔒 Restricted Page</h2><p style={{ color: "#6b7280" }}>This page is only available to authorized ETT staff members.</p><Btn onClick={() => setPage("login")}>Staff Login</Btn></Card>;
        switch (page) {
          case "dashboard": return <Dashboard user={user} reports={reports} setPage={setPage} />;
          case "submit": return <SubmitReport user={user} onSubmit={addReport} showToast={showToast} />;
          case "reports":
          case "my_reports": return <ReportsPage user={user} reports={reports} onUpdateStatus={updateStatus} showToast={showToast} onEditReport={setEditingReport} onForwardReport={setForwardModal} />;
          case "maps": return <MapsPage setPage={setPage} user={user} focus={mapFocus} />;
          case "clusters": return <ClustersPage user={user} setPage={setPage} onOpenMap={openMapTarget} />;
          case "districts": return <DistrictsPage user={user} onOpenMap={openMapTarget} />;
          case "trainings": return <TrainingsPage />;
          case "curriculum": return <CurriculumPage />;
          case "ett": return <ETTPage />;
          case "analytics": return <AnalyticsPage reports={reports} />;
          case "users": return <UsersPage user={user} showToast={showToast} />;
          case "impact": return <ImpactPage reports={reports} showToast={showToast} user={user} />;
          default: return <Dashboard user={user} reports={reports} setPage={setPage} />;
        }
      };

      return (
        <>
          <GlobalStyles />
          <div style={{ minHeight: "100vh", background: isLoginPage ? "#fff" : "#f4f6fa", display: "flex" }}>
            {!isLoginPage && <Sidebar page={page} setPage={setPage} user={user} onLogout={() => { setUser(null); setPage("dashboard"); }} open={sidebarOpen} onClose={() => setSidebarOpen(false)} />}
            <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

              {/* ── TOPBAR — hidden on login page ─── */}
              {!isLoginPage && (<div
                data-topbar
                style={{
                  position: "fixed",
                  top: 0, left: 0, right: 0,
                  background: "#0f1623",
                  borderBottom: "1px solid rgba(255,255,255,.07)",
                  height: 64,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",         /* centre the inner container */
                  padding: "0 24px",
                  flexShrink: 0,
                  zIndex: 1000,
                  boxShadow: "0 2px 20px rgba(0,0,0,.25)",
                }}
              >
                {/* Inner container — same width cap as the content area */}
                <div style={{
                  width: "100%",
                  maxWidth: 1400,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "space-between",
                }}>
                  {/* ── Left group ── */}
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    {page === "dashboard" ? (
                      <button
                        onClick={() => setSidebarOpen(!sidebarOpen)}
                        style={{
                          border: "none",
                          background: sidebarOpen ? "rgba(232,93,4,.15)" : "rgba(255,255,255,.06)",
                          cursor: "pointer",
                          padding: "8px 9px",
                          borderRadius: 9,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          transition: "all .14s",
                          flexShrink: 0,
                        }}
                      >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={sidebarOpen ? OR : "rgba(255,255,255,.7)"} strokeWidth="2.2" strokeLinecap="round">
                          {sidebarOpen
                            ? (<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>)
                            : (<><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></>)
                          }
                        </svg>
                      </button>
                    ) : (
                      <button
                        onClick={() => setPage("dashboard")}
                        style={{
                          border: "1px solid rgba(255,255,255,.12)",
                          background: "rgba(255,255,255,.06)",
                          cursor: "pointer",
                          padding: "6px 13px",
                          borderRadius: 9,
                          display: "flex", alignItems: "center", gap: 5,
                          fontSize: 13, fontWeight: 600,
                          color: "rgba(255,255,255,.8)",
                          transition: "all .14s",
                          flexShrink: 0,
                        }}
                        onMouseEnter={e => { e.currentTarget.style.background = "rgba(232,93,4,.18)"; e.currentTarget.style.color = "#fff"; e.currentTarget.style.borderColor = OR; }}
                        onMouseLeave={e => { e.currentTarget.style.background = "rgba(255,255,255,.06)"; e.currentTarget.style.color = "rgba(255,255,255,.8)"; e.currentTarget.style.borderColor = "rgba(255,255,255,.12)"; }}
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6" /></svg>Back
                      </button>
                    )}

                    {/* Logo + app name */}
                    <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                      <AfricaLogo size={28} />
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ fontSize: 15, fontWeight: 800, color: "#fff", letterSpacing: "-0.3px" }}>ETT Malawi</span>
                        {page !== "dashboard" && (
                          <>
                            <span style={{ color: "rgba(255,255,255,.25)", margin: "0 2px" }}>›</span>
                            <span style={{ color: "rgba(255,255,255,.65)", fontSize: 13, fontWeight: 500 }}>{PAGE_LABELS[page] || page}</span>
                          </>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* ── Right group ── */}
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    {/* Notification bell */}
                    {user && can(user.role, "approveReport") && (
                      <div style={{ position: "relative" }} data-notif-root="1">
                        <button
                          onClick={() => setNotifOpen(o => !o)}
                          title={pendingCount > 0 ? `${pendingCount} pending report${pendingCount > 1 ? "s" : ""} awaiting review` : "No pending reports"}
                          style={{
                            background: notifOpen ? "rgba(232,93,4,.18)" : "rgba(255,255,255,.06)",
                            border: `1px solid ${notifOpen ? OR : "rgba(255,255,255,.12)"}`,
                            borderRadius: 9,
                            width: 38, height: 38,
                            cursor: "pointer",
                            color: "rgba(255,255,255,.8)",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            transition: "all .14s",
                            position: "relative",
                            flexShrink: 0,
                          }}
                          onMouseEnter={e => { e.currentTarget.style.background = "rgba(232,93,4,.18)"; e.currentTarget.style.borderColor = OR; }}
                          onMouseLeave={e => { if (!notifOpen) { e.currentTarget.style.background = "rgba(255,255,255,.06)"; e.currentTarget.style.borderColor = "rgba(255,255,255,.12)"; } }}
                        >
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                          </svg>
                          {pendingCount > 0 && (
                            <span style={{ position: "absolute", top: -5, right: -5, background: "#ef4444", color: "#fff", borderRadius: "50%", minWidth: 18, height: 18, fontSize: 10, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", border: "2px solid #0f1623", padding: "0 2px", lineHeight: 1 }}>
                              {pendingCount > 9 ? "9+" : pendingCount}
                            </span>
                          )}
                        </button>

                        {notifOpen && (
                          <div style={{ position: "absolute", top: 46, right: 0, background: "#fff", borderRadius: 14, boxShadow: "0 12px 40px rgba(10,16,28,.22)", border: "1px solid #e8ecf2", width: 300, zIndex: 2000, overflow: "hidden", animation: "slideUp .18s ease" }}>
                            <div style={{ padding: "14px 16px 10px", borderBottom: "1px solid #f0f2f6", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                              <span style={{ fontWeight: 700, fontSize: 13, color: BLACK }}>Pending Reviews</span>
                              {pendingCount > 0 && <span style={{ background: "#fef9c3", color: "#92400e", borderRadius: 20, padding: "2px 9px", fontSize: 11, fontWeight: 700 }}>{pendingCount} pending</span>}
                            </div>
                            <div style={{ maxHeight: 260, overflowY: "auto" }}>
                              {reports.filter(r => r.status === "pending" && (user.role === "district_coordinator" ? r.district === user.district : true)).length === 0 ? (
                                <div style={{ padding: "20px 16px", textAlign: "center", color: "#9ca3af", fontSize: 13 }}>
                                  <div style={{ fontSize: 24, marginBottom: 6 }}>✅</div>
                                  All caught up — no pending reports
                                </div>
                              ) : (
                                reports.filter(r => r.status === "pending" && (user.role === "district_coordinator" ? r.district === user.district : true)).slice(0, 6).map(r => (
                                  <div key={r.id} onClick={() => { setPage("reports"); setNotifOpen(false); }} style={{ padding: "11px 16px", borderBottom: "1px solid #f5f7fb", cursor: "pointer", transition: "background .13s", display: "flex", gap: 10, alignItems: "flex-start" }}
                                    onMouseEnter={e => e.currentTarget.style.background = "#fafbfd"}
                                    onMouseLeave={e => e.currentTarget.style.background = "#fff"}
                                  >
                                    <div style={{ width: 32, height: 32, borderRadius: 8, background: OR_PALE, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: 14 }}>📋</div>
                                    <div style={{ minWidth: 0, flex: 1 }}>
                                      <div style={{ fontWeight: 700, fontSize: 12.5, color: BLACK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.school}</div>
                                      <div style={{ fontSize: 11, color: "#6b7280", marginTop: 1 }}>{r.district} · {r.submitted_at}</div>
                                      <div style={{ fontSize: 10.5, color: OR_D, marginTop: 2, fontWeight: 600 }}>Awaiting review →</div>
                                    </div>
                                  </div>
                                ))
                              )}
                            </div>
                            {pendingCount > 0 && (
                              <div style={{ padding: "10px 16px", borderTop: "1px solid #f0f2f6" }}>
                                <button onClick={() => { setPage("reports"); setNotifOpen(false); }} style={{ width: "100%", background: OR, color: "#fff", border: "none", borderRadius: 9, padding: "8px", fontWeight: 700, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit" }}>
                                  Review All Pending Reports
                                </button>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    )}

                    {/* User pill / Sign In */}
                    {user ? (
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <div
                          style={{ background: "rgba(232,93,4,.15)", border: "1px solid rgba(232,93,4,.25)", color: OR, padding: "5px 13px", borderRadius: 20, fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}
                          onClick={() => setPage("dashboard")}
                        >
                          {ROLE_CFG[user.role].icon} {user.name}
                        </div>
                        <button
                          onClick={() => { setUser(null); setPage("dashboard"); }}
                          style={{ background: "rgba(255,255,255,.07)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 9, padding: "6px 13px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: "rgba(255,255,255,.75)", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5, transition: "all .14s" }}
                          onMouseEnter={e => { e.currentTarget.style.background = "rgba(232,93,4,.18)"; e.currentTarget.style.color = "#fff"; }}
                          onMouseLeave={e => { e.currentTarget.style.background = "rgba(255,255,255,.07)"; e.currentTarget.style.color = "rgba(255,255,255,.75)"; }}
                        >
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out
                        </button>
                      </div>
                    ) : (
                      <Btn size="sm" onClick={() => setPage("login")}>Sign In</Btn>
                    )}
                  </div>
                </div>
              </div>)}
              {/* END TOPBAR */}

              {/* CONTENT */}
              <div data-content style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", alignItems: "center", padding: isLoginPage ? "0" : "88px 24px 32px 24px", marginTop: 0 }}>
                <div style={{ width: "100%", maxWidth: isLoginPage ? "100%" : 1400, flex: 1 }} className="page-enter">{renderPage()}</div>

                {/* FOOTER — hidden on login */}
                {!isLoginPage && (
                <div style={{ width: "100%", maxWidth: 1400, marginTop: 48, paddingTop: 24, paddingBottom: 24, borderTop: "1px solid #e8ecf2", textAlign: "center", flexShrink: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}>
                    <AfricaLogo size={22} variant="orange" />
                    <span style={{ fontSize: 13, fontWeight: 800, color: BLACK }}>ScaleUp ETT Program</span>
                  </div>
                  <div style={{ fontSize: 12.5, fontWeight: 600, color: "#374151", marginBottom: 3 }}>Empowering the Boys and Girls to fight GBV</div>
                  <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 4 }}>Child Protection and Empowerment Program</div>
                  <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 12 }}>© 2026 Ujamaa Africa. All rights reserved.</div>
                  <div style={{ display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap" }}>
                    {[["🆘", "Child Helpline", "116"], ["👮", "VSU Police", "997"], ["🔔", "Ujamaa Helpline", "0984 110 288"], ["📧", "Email", "infor.pamodzi@ujamaa-africa.org"]].map(([icon, label, val]) => (
                      <span key={label} style={{ fontSize: 11, color: "#9ca3af", display: "flex", alignItems: "center", gap: 4 }}>{icon} <b style={{ color: "#6b7280" }}>{label}:</b> {val}</span>
                    ))}
                  </div>
                </div>
                )}
              </div>
            </div>
          </div>
          {toast && <Toast msg={toast} onClose={() => setToast(null)} />}

          {/* Change 4: Data Officer inline edit modal */}
          {editingReport && (
            <DataEditModal
              report={editingReport}
              onSave={saveEditedReport}
              onClose={() => setEditingReport(null)}
            />
          )}

          {/* Change 3: Forward report confirmation modal */}
          {forwardModal && (
            <Modal title="Forward Report to Admin" onClose={() => setForwardModal(null)} width={420}>
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 13, color: "#374151", lineHeight: 1.6, marginBottom: 12 }}>
                  You are about to forward the report from <b>{forwardModal.school}</b> ({forwardModal.district}) to the <b>National Admin</b> for final review.
                </div>
                <div style={{ background: OR_PALE, borderRadius: 8, padding: "10px 14px", fontSize: 12, color: OR_D, fontWeight: 600 }}>
                  📨 Workflow: District Coordinator → National Admin
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={() => forwardReport(forwardModal.id)}>📨 Forward to Admin</Btn>
                <Btn variant="secondary" onClick={() => setForwardModal(null)}>Cancel</Btn>
              </div>
            </Modal>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
